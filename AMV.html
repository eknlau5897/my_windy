<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>West Pacific AMV Winds & Weather</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; background: #0b0f19; color: #fff; }
        #map { height: 100vh; width: 100vw; }

        .control-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(8px);
            padding: 16px 20px;
            border-radius: 10px;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 295px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .control-panel h3 { margin: 0 0 10px 0; font-size: 14px; text-transform: uppercase; color: #38bdf8; letter-spacing: 0.5px; }
        .filter-section-title { font-size: 11px; text-transform: uppercase; color: #94a3b8; margin: 10px 0 6px 0; letter-spacing: 0.5px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 3px; }
        .filter-option { display: flex; align-items: center; justify-content: space-between; font-size: 13px; margin-bottom: 6px; cursor: pointer; }
        
        .badge { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
        .btn-row { display: flex; gap: 6px; margin-top: 10px; }
        .btn-action {
            flex: 1;
            background: #0284c7;
            color: #fff;
            border: none;
            padding: 7px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 11px;
        }
        .btn-action:hover { background: #0369a1; }
        .btn-secondary { background: #334155; }
        .btn-secondary:hover { background: #475569; }

        select.chart-dropdown {
            width: 100%;
            padding: 6px;
            border-radius: 6px;
            background: #1e293b;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 12px;
            margin-top: 4px;
        }

        .status { margin-top: 10px; font-size: 11px; color: #94a3b8; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 8px; }
        .wind-barb-icon { background: transparent !important; border: none !important; }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="control-panel">
        <h3>West Pacific Weather</h3>

        <div class="filter-section-title">Satellite IR (NASA GIBS / Himawari)</div>
        <label class="filter-option">
            <span>Show Himawari IR Band13</span>
            <input type="checkbox" id="chkSat" checked onchange="toggleSatellite()">
        </label>
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;">
            <span style="font-size: 11px; color: #94a3b8;">Sat Opacity</span>
            <input type="range" id="satOpacity" min="0.1" max="1.0" step="0.05" value="0.5" oninput="adjustSatOpacity()" style="width: 110px;">
        </div>

        <div class="filter-section-title">Synoptic / Upper-Air WMS</div>
        <select id="synopticWmsSelect" class="chart-dropdown" onchange="updateSynopticWMS()">
            <option value="none">None (Disabled)</option>
            <option value="surface">MSLP Pressure Analysis Isobars</option>
            <option value="850">850 hPa Geopotential Height & Temp</option>
            <option value="500">500 hPa Geopotential Height</option>
            <option value="250">250 hPa Upper-Level Wind Speed</option>
        </select>
        
        <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 8px;">
            <span style="font-size: 11px; color: #94a3b8;">WMS Opacity</span>
            <input type="range" id="wmsOpacity" min="0.1" max="1.0" step="0.05" value="0.75" oninput="adjustWmsOpacity()" style="width: 110px;">
        </div>

        <div style="display: flex; gap: 6px; margin-top: 12px; margin-bottom: 8px;">
            <button class="btn-action" onclick="setAllLevels(true)">Select All</button>
            <button class="btn-action btn-secondary" onclick="setAllLevels(false)">Deselect All</button>
        </div>

        <div class="filter-section-title">AMV Pressure Levels (hPa)</div>
        <div id="filters">
            <label class="filter-option">
                <span><span class="badge" style="background: #a855f7;"></span> 250 hPa (Upper)</span>
                <input type="checkbox" class="lvl-chk" value="250" checked onchange="filterAndRender()">
            </label>
            <label class="filter-option">
                <span><span class="badge" style="background: #3b82f6;"></span> 300 hPa</span>
                <input type="checkbox" class="lvl-chk" value="300" checked onchange="filterAndRender()">
            </label>
            <label class="filter-option">
                <span><span class="badge" style="background: #06b6d4;"></span> 400 hPa</span>
                <input type="checkbox" class="lvl-chk" value="400" checked onchange="filterAndRender()">
            </label>
            <label class="filter-option">
                <span><span class="badge" style="background: #10b981;"></span> 500 hPa (Mid)</span>
                <input type="checkbox" class="lvl-chk" value="500" checked onchange="filterAndRender()">
            </label>
            <label class="filter-option">
                <span><span class="badge" style="background: #84cc16;"></span> 700 hPa</span>
                <input type="checkbox" class="lvl-chk" value="700" checked onchange="filterAndRender()">
            </label>
            <label class="filter-option">
                <span><span class="badge" style="background: #eab308;"></span> 850 hPa (Low)</span>
                <input type="checkbox" class="lvl-chk" value="850" checked onchange="filterAndRender()">
            </label>
            <label class="filter-option">
                <span><span class="badge" style="background: #f97316;"></span> 925 hPa</span>
                <input type="checkbox" class="lvl-chk" value="925" checked onchange="filterAndRender()">
            </label>
            <label class="filter-option">
                <span><span class="badge" style="background: #ef4444;"></span> 1000 hPa (Surface)</span>
                <input type="checkbox" class="lvl-chk" value="1000" checked onchange="filterAndRender()">
            </label>
        </div>

        <div class="filter-section-title">Layers</div>
        <label class="filter-option">
            <span><span class="badge" style="border: 1px solid #ff0000; background: transparent;"></span> Show Red Coastlines</span>
            <input type="checkbox" id="chkCoastlines" checked onchange="toggleCoastlines()">
        </label>

        <div class="btn-row">
            <button class="btn-action" onclick="fetchLiveData()">Fetch Live Data</button>
        </div>

        <div class="status">
            <div>Status: <span id="statusText" style="color: #38bdf8;">Initializing...</span></div>
            <div>Active Points: <strong id="pointCount" style="color: #fff;">0</strong></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const map = L.map('map', {
            center: [25.0, 130.0],
            zoom: 4
        });

        // Dark Base Map
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap &copy; CARTO'
        }).addTo(map);

        // --- NASA GIBS Satellite Background Layer ---
        const now = new Date();
        const targetTime = new Date(now.getTime() - 50 * 60 * 1000);
        targetTime.setUTCMinutes(Math.floor(targetTime.getUTCMinutes() / 10) * 10, 0, 0);
        const isoTimeString = targetTime.toISOString().split('.')[0] + 'Z';

        const nasaGibsSatWMS = L.tileLayer.wms('https://gibs.earthdata.nasa.gov/wms/epsg4326/best/wms.cgi', {
            layers: 'Himawari_AHI_Band13_Clean_Infrared',
            format: 'image/png',
            transparent: true,
            opacity: 0.5,
            version: '1.3.0',
            time: isoTimeString,
            attribution: '&copy; NASA GIBS / EOSDIS'
        }).addTo(map);

        function toggleSatellite() {
            if (document.getElementById('chkSat').checked) {
                map.addLayer(nasaGibsSatWMS);
            } else {
                map.removeLayer(nasaGibsSatWMS);
            }
        }

        function adjustSatOpacity() {
            const val = parseFloat(document.getElementById('satOpacity').value);
            nasaGibsSatWMS.setOpacity(val);
        }

        // --- Global Synoptic Surface & Upper-Air WMS (MSC GeoMet) ---
        let activeSynopticWms = null;

        function updateSynopticWMS() {
            const selectedType = document.getElementById('synopticWmsSelect').value;

            if (activeSynopticWms) {
                map.removeLayer(activeSynopticWms);
                activeSynopticWms = null;
            }

            if (selectedType === 'none') return;

            const opacity = parseFloat(document.getElementById('wmsOpacity').value);

            if (selectedType === 'surface') {
                activeSynopticWms = L.tileLayer.wms('https://geo.weather.gc.ca/geomet', {
                    layers: 'GDPS.ETA_PR',
                    format: 'image/png',
                    transparent: true,
                    version: '1.3.0',
                    opacity: opacity,
                    attribution: '&copy; MSC GeoMet / Environment Canada'
                }).addTo(map);
            } 
            else if (selectedType === '850') {
                activeSynopticWms = L.tileLayer.wms('https://geo.weather.gc.ca/geomet', {
                    layers: 'GDPS.3_GZ.850',
                    format: 'image/png',
                    transparent: true,
                    version: '1.3.0',
                    opacity: opacity,
                    attribution: '&copy; MSC GeoMet / Environment Canada'
                }).addTo(map);
            }
            else if (selectedType === '500') {
                activeSynopticWms = L.tileLayer.wms('https://geo.weather.gc.ca/geomet', {
                    layers: 'GDPS.3_GZ.500',
                    format: 'image/png',
                    transparent: true,
                    version: '1.3.0',
                    opacity: opacity,
                    attribution: '&copy; MSC GeoMet / Environment Canada'
                }).addTo(map);
            }
            else if (selectedType === '250') {
                activeSynopticWms = L.tileLayer.wms('https://geo.weather.gc.ca/geomet', {
                    layers: 'GDPS.ETA_UU.250',
                    format: 'image/png',
                    transparent: true,
                    version: '1.3.0',
                    opacity: opacity,
                    attribution: '&copy; MSC GeoMet / Environment Canada'
                }).addTo(map);
            }
        }

        function adjustWmsOpacity() {
            if (activeSynopticWms && activeSynopticWms.setOpacity) {
                const val = parseFloat(document.getElementById('wmsOpacity').value);
                activeSynopticWms.setOpacity(val);
            }
        }

        // --- Coastlines ---
        let coastlineLayer = null;
        async function loadRedCoastlines() {
            try {
                const response = await fetch('https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_coastline.geojson');
                const geojsonData = await response.json();
                coastlineLayer = L.geoJSON(geojsonData, {
                    style: { color: '#ff2222', weight: 1.5, opacity: 0.85 }
                }).addTo(map);
            } catch (e) {
                console.warn("Could not load coastline GeoJSON:", e);
            }
        }
        loadRedCoastlines();

        function toggleCoastlines() {
            if (!coastlineLayer) return;
            if (document.getElementById('chkCoastlines').checked) {
                map.addLayer(coastlineLayer);
            } else {
                map.removeLayer(coastlineLayer);
            }
        }

        // --- AMV Wind Barbs Processing ---
        let rawAMVData = [];
        let amvLayerGroup = L.layerGroup().addTo(map);

        function setAllLevels(state) {
            document.querySelectorAll('.lvl-chk').forEach(chk => chk.checked = state);
            filterAndRender();
        }

        function snapToStandardLevel(p) {
            const levels = [250, 300, 400, 500, 700, 850, 925, 1000];
            let closest = levels[0];
            let minDiff = Math.abs(p - closest);
            for (let i = 1; i < levels.length; i++) {
                let diff = Math.abs(p - levels[i]);
                if (diff < minDiff) {
                    minDiff = diff;
                    closest = levels[i];
                }
            }
            return closest;
        }

        function getColorForLevel(p) {
            switch(p) {
                case 250: return '#a855f7';
                case 300: return '#3b82f6';
                case 400: return '#06b6d4';
                case 500: return '#10b981';
                case 700: return '#84cc16';
                case 850: return '#eab308';
                case 925: return '#f97316';
                case 1000: return '#ef4444';
                default: return '#38bdf8';
            }
        }

        // Corrected Meteorological SVG Wind Barb Generator
        function createWindBarbSVG(speedMS, dirDeg, color, lat = 25) {
    const knots = Math.round(speedMS * 1.94384);
    let k = knots;

    let flags50 = Math.floor(k / 50); k %= 50;
    let lines10 = Math.floor(k / 10); k %= 10;
    let lines5 = Math.floor(k / 5);

    // Calm winds (< 3 knots)
    if (knots < 3) {
        return `<svg width="40" height="40" viewBox="0 0 40 40">
            <circle cx="20" cy="20" r="4" fill="none" stroke="${color}" stroke-width="2" />
        </svg>`;
    }

    let barbElements = '';
    let yPos = 4; // Start at top/outer tail end of the staff
    
    const isNH = lat >= 0;
    const xEnd10 = isNH ? 8 : 32;   // Barbs project left in NH
    const xEnd5  = isNH ? 14 : 26;

    // Draw 50-kt pennants (flags slope down toward station dot y=20)
    for (let i = 0; i < flags50; i++) {
        const polyPoints = isNH 
            ? `20,${yPos} 8,${yPos + 4} 20,${yPos + 7}` 
            : `20,${yPos} 32,${yPos + 4} 20,${yPos + 7}`;
        barbElements += `<polygon points="${polyPoints}" fill="${color}" />`;
        yPos += 7;
    }

    // Draw 10-kt full barbs (slanted down toward y=20)
    for (let i = 0; i < lines10; i++) {
        barbElements += `<line x1="20" y1="${yPos}" x2="${xEnd10}" y2="${yPos + 4}" stroke="${color}" stroke-width="2" stroke-linecap="round" />`;
        yPos += 5;
    }

    // Draw 5-kt half barbs
    for (let i = 0; i < lines5; i++) {
        barbElements += `<line x1="20" y1="${yPos}" x2="${xEnd5}" y2="${yPos + 3}" stroke="${color}" stroke-width="2" stroke-linecap="round" />`;
        yPos += 5;
    }

    return `
    <div style="transform: rotate(${dirDeg}deg); transform-origin: center center; width: 40px; height: 40px;">
        <svg width="40" height="40" viewBox="0 0 40 40">
            <!-- Staff line from station dot (20,20) extending outward to (20,4) -->
            <line x1="20" y1="20" x2="20" y2="4" stroke="${color}" stroke-width="2" stroke-linecap="round" />
            <!-- Station center dot -->
            <circle cx="20" cy="20" r="2.5" fill="${color}" />
            <!-- Barbs at outer tail -->
            ${barbElements}
        </svg>
    </div>`;
}

        async function fetchLiveData() {
            const statusEl = document.getElementById('statusText');
            statusEl.innerText = "Fetching NOAA data...";

            const rawUrl = 'https://coastwatch.pfeg.noaa.gov/erddap/tabledap/noaa_nesdis_amv.json?latitude,longitude,pressure,wind_speed,wind_direction&latitude>=-10&latitude<=50&longitude>=100&longitude<=180&last3000';
            const corsProxyUrl = 'https://corsproxy.io/?' + encodeURIComponent(rawUrl);

            try {
                const response = await fetch(corsProxyUrl);
                if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
                
                const data = await response.json();
                const rows = data.table.rows;
                
                rawAMVData = rows.map(row => ({
                    lat: row[0],
                    lon: row[1],
                    pressure: row[2],
                    speed: row[3],
                    direction: row[4]
                }));

                statusEl.innerText = "Updated Live";
                filterAndRender();

            } catch (error) {
                console.warn("Proxy fetch failed, fallback to local data.json...", error);
                fetchFallbackJSON();
            }
        }

        async function fetchFallbackJSON() {
            try {
                const res = await fetch('data.json?t=' + new Date().getTime());
                if (!res.ok) throw new Error("Local data.json not found");
                
                const geojson = await res.json();
                rawAMVData = geojson.features.map(f => ({
                    lat: f.geometry.coordinates[1],
                    lon: f.geometry.coordinates[0],
                    pressure: f.properties.pressure_hpa,
                    speed: f.properties.speed_ms,
                    direction: f.properties.direction
                }));

                document.getElementById('statusText').innerText = "Loaded data.json";
                filterAndRender();
            } catch(e) {
                document.getElementById('statusText').innerText = "Fetch Error";
            }
        }

        function filterAndRender() {
            amvLayerGroup.clearLayers();

            const activeLevels = {};
            document.querySelectorAll('.lvl-chk').forEach(chk => {
                if (chk.checked) activeLevels[parseInt(chk.value)] = true;
            });

            const filteredPoints = rawAMVData.filter(pt => {
                const lvl = snapToStandardLevel(pt.pressure);
                return activeLevels[lvl];
            });

            filteredPoints.forEach(pt => {
                const stdLvl = snapToStandardLevel(pt.pressure);
                const color = getColorForLevel(stdLvl);
                const svgHtml = createWindBarbSVG(pt.speed, pt.direction, color, pt.lat);

                const icon = L.divIcon({
                    html: svgHtml,
                    className: 'wind-barb-icon',
                    iconSize: [40, 40],
                    iconAnchor: [20, 20]
                });

                const marker = L.marker([pt.lat, pt.lon], { icon: icon });
                const speedKnots = Math.round(pt.speed * 1.94384);

                marker.bindPopup(`
                    <strong>AMV Wind Observation</strong><br/>
                    <b>Pressure:</b> ${pt.pressure} hPa (Level: ${stdLvl} hPa)<br/>
                    <b>Speed:</b> ${pt.speed} m/s (${speedKnots} kts)<br/>
                    <b>Direction:</b> ${pt.direction}°
                `);

                amvLayerGroup.addLayer(marker);
            });

            document.getElementById('pointCount').innerText = filteredPoints.length;
        }

        fetchLiveData();
        setInterval(fetchLiveData, 600000);
    </script>
</body>
</html>
