<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>West Pacific Himawari Infrared & AMV Streamlines</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; background: #0b0f19; color: #fff; }
        #map { height: 100vh; width: 100vw; }

        .control-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(8px);
            padding: 16px 20px;
            border-radius: 10px;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 285px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .control-panel h3 { margin: 0 0 10px 0; font-size: 14px; text-transform: uppercase; color: #38bdf8; letter-spacing: 0.5px; }
        .filter-section-title { font-size: 11px; text-transform: uppercase; color: #94a3b8; margin: 10px 0 6px 0; letter-spacing: 0.5px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 3px; }
        .filter-option { display: flex; align-items: center; justify-content: space-between; font-size: 13px; margin-bottom: 6px; cursor: pointer; }
        
        .badge { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
        .btn-row { display: flex; gap: 6px; margin-top: 10px; }
        .btn-action {
            flex: 1;
            background: #0284c7;
            color: #fff;
            border: none;
            padding: 7px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 11px;
        }
        .btn-action:hover { background: #0369a1; }
        .btn-secondary { background: #334155; }
        .btn-secondary:hover { background: #475569; }

        .status { margin-top: 10px; font-size: 11px; color: #94a3b8; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 8px; }

        .wind-barb-icon { background: transparent !important; border: none !important; }
        .stream-arrow { background: transparent !important; border: none !important; }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="control-panel">
        <h3>West Pacific AMV Winds</h3>

        <div class="filter-section-title">Display Mode</div>
        <label class="filter-option">
            <span>Show Wind Barbs</span>
            <input type="radio" name="mode" value="barbs" checked onchange="toggleRenderMode()">
        </label>
        <label class="filter-option">
            <span>Show Streamlines</span>
            <input type="radio" name="mode" value="streamlines" onchange="toggleRenderMode()">
        </label>
        
        <div style="display: flex; gap: 6px; margin-top: 8px; margin-bottom: 8px;">
            <button class="btn-action" onclick="setAllLevels(true)">Select All</button>
            <button class="btn-action btn-secondary" onclick="setAllLevels(false)">Deselect All</button>
        </div>

        <div class="filter-section-title">Pressure Levels (hPa)</div>
        <div id="filters">
            <label class="filter-option">
                <span><span class="badge" style="background: #a855f7;"></span> 250 hPa (Upper)</span>
                <input type="checkbox" class="lvl-chk" value="250" checked onchange="filterAndRender()">
            </label>
            <label class="filter-option">
                <span><span class="badge" style="background: #3b82f6;"></span> 300 hPa</span>
                <input type="checkbox" class="lvl-chk" value="300" checked onchange="filterAndRender()">
            </label>
            <label class="filter-option">
                <span><span class="badge" style="background: #06b6d4;"></span> 400 hPa</span>
                <input type="checkbox" class="lvl-chk" value="400" checked onchange="filterAndRender()">
            </label>
            <label class="filter-option">
                <span><span class="badge" style="background: #10b981;"></span> 500 hPa (Mid)</span>
                <input type="checkbox" class="lvl-chk" value="500" checked onchange="filterAndRender()">
            </label>
            <label class="filter-option">
                <span><span class="badge" style="background: #84cc16;"></span> 700 hPa</span>
                <input type="checkbox" class="lvl-chk" value="700" checked onchange="filterAndRender()">
            </label>
            <label class="filter-option">
                <span><span class="badge" style="background: #eab308;"></span> 850 hPa (Low)</span>
                <input type="checkbox" class="lvl-chk" value="850" checked onchange="filterAndRender()">
            </label>
            <label class="filter-option">
                <span><span class="badge" style="background: #f97316;"></span> 925 hPa</span>
                <input type="checkbox" class="lvl-chk" value="925" checked onchange="filterAndRender()">
            </label>
            <label class="filter-option">
                <span><span class="badge" style="background: #ef4444;"></span> 1000 hPa (Surface)</span>
                <input type="checkbox" class="lvl-chk" value="1000" checked onchange="filterAndRender()">
            </label>
        </div>

        <div class="filter-section-title">Layers</div>
        <label class="filter-option">
            <span><span class="badge" style="border: 1px solid #ff0000; background: transparent;"></span> Show Red Coastlines</span>
            <input type="checkbox" id="chkCoastlines" checked onchange="toggleCoastlines()">
        </label>

        <div class="btn-row">
            <button class="btn-action" onclick="fetchLiveData()">Fetch Live Data</button>
        </div>

        <div class="status">
            <div>Status: <span id="statusText" style="color: #38bdf8;">Initializing...</span></div>
            <div>Active Features: <strong id="pointCount" style="color: #fff;">0</strong></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const map = L.map('map', {
            center: [15.0, 135.0],
            zoom: 4
        });

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap &copy; CARTO'
        }).addTo(map);

        const now = new Date();
        const targetTime = new Date(now.getTime() - 50 * 60 * 1000);
        targetTime.setUTCMinutes(Math.floor(targetTime.getUTCMinutes() / 10) * 10, 0, 0);
        const isoTimeString = targetTime.toISOString().split('.')[0] + 'Z';

        const nasaGibsBand13 = L.tileLayer.wms('https://gibs.earthdata.nasa.gov/wms/epsg4326/best/wms.cgi', {
            layers: 'Himawari_AHI_Band13_Clean_Infrared',
            format: 'image/png',
            transparent: true,
            opacity: 0.65,
            version: '1.3.0',
            time: isoTimeString,
            attribution: '&copy; NASA GIBS / EOSDIS'
        }).addTo(map);

        let coastlineLayer = null;
        async function loadRedCoastlines() {
            try {
                const response = await fetch('https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_coastline.geojson');
                const geojsonData = await response.json();
                coastlineLayer = L.geoJSON(geojsonData, {
                    style: { color: '#ff2222', weight: 1.5, opacity: 0.85 }
                }).addTo(map);
            } catch (e) {
                console.warn("Could not load coastline GeoJSON:", e);
            }
        }
        loadRedCoastlines();

        function toggleCoastlines() {
            if (!coastlineLayer) return;
            if (document.getElementById('chkCoastlines').checked) {
                map.addLayer(coastlineLayer);
            } else {
                map.removeLayer(coastlineLayer);
            }
        }

        let rawAMVData = [];
        let amvLayerGroup = L.layerGroup().addTo(map);

        function setAllLevels(state) {
            document.querySelectorAll('.lvl-chk').forEach(chk => chk.checked = state);
            filterAndRender();
        }

        function snapToStandardLevel(p) {
            const levels = [250, 300, 400, 500, 700, 850, 925, 1000];
            let closest = levels[0];
            let minDiff = Math.abs(p - closest);
            for (let i = 1; i < levels.length; i++) {
                let diff = Math.abs(p - levels[i]);
                if (diff < minDiff) {
                    minDiff = diff;
                    closest = levels[i];
                }
            }
            return closest;
        }

        function getColorForLevel(p) {
            switch(p) {
                case 250: return '#a855f7';
                case 300: return '#3b82f6';
                case 400: return '#06b6d4';
                case 500: return '#10b981';
                case 700: return '#84cc16';
                case 850: return '#eab308';
                case 925: return '#f97316';
                case 1000: return '#ef4444';
                default: return '#38bdf8';
            }
        }

        function createWindBarbSVG(speedMS, dirDeg, color) {
            const knots = Math.round(speedMS * 1.94384);
            let k = knots;
            let flags50 = Math.floor(k / 50); k %= 50;
            let lines10 = Math.floor(k / 10); k %= 10;
            let lines5 = Math.floor(k / 5);

            let barbElements = '';
            let yPos = 4;

            for (let i = 0; i < flags50; i++) {
                barbElements += `<polygon points="20,${yPos} 32,${yPos + 2} 20,${yPos + 6}" fill="${color}" />`;
                yPos += 7;
            }
            for (let i = 0; i < lines10; i++) {
                barbElements += `<line x1="20" y1="${yPos}" x2="32" y2="${yPos - 4}" stroke="${color}" stroke-width="2" stroke-linecap="round" />`;
                yPos += 5;
            }
            for (let i = 0; i < lines5; i++) {
                barbElements += `<line x1="20" y1="${yPos}" x2="26" y2="${yPos - 2}" stroke="${color}" stroke-width="2" stroke-linecap="round" />`;
                yPos += 5;
            }

            if (knots < 3) {
                return `<svg width="40" height="40" viewBox="0 0 40 40"><circle cx="20" cy="20" r="4" fill="none" stroke="${color}" stroke-width="2" /></svg>`;
            }

            return `
            <div style="transform: rotate(${dirDeg}deg); transform-origin: center center; width: 40px; height: 40px;">
                <svg width="40" height="40" viewBox="0 0 40 40">
                    <circle cx="20" cy="20" r="2.5" fill="${color}" />
                    <line x1="20" y1="20" x2="20" y2="4" stroke="${color}" stroke-width="2" stroke-linecap="round" />
                    ${barbElements}
                </svg>
            </div>`;
        }

        async function fetchLiveData() {
            const statusEl = document.getElementById('statusText');
            statusEl.innerText = "Fetching NOAA data...";

            const rawUrl = 'https://coastwatch.pfeg.noaa.gov/erddap/tabledap/noaa_nesdis_amv.json?latitude,longitude,pressure,wind_speed,wind_direction&latitude>=-10&latitude<=50&longitude>=100&longitude<=180&last3000';
            const corsProxyUrl = 'https://corsproxy.io/?' + encodeURIComponent(rawUrl);

            try {
                const response = await fetch(corsProxyUrl);
                if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
                
                const data = await response.json();
                const rows = data.table.rows;
                
                rawAMVData = rows.map(row => ({
                    lat: row[0],
                    lon: row[1],
                    pressure: row[2],
                    speed: row[3],
                    direction: row[4]
                }));

                statusEl.innerText = "Updated Live";
                filterAndRender();

            } catch (error) {
                console.warn("Proxy fetch failed, loading local fallback data.json...", error);
                fetchFallbackJSON();
            }
        }

        async function fetchFallbackJSON() {
            try {
                const res = await fetch('data.json?t=' + new Date().getTime());
                if (!res.ok) throw new Error("Local data.json not found");
                
                const geojson = await res.json();
                rawAMVData = geojson.features.map(f => ({
                    lat: f.geometry.coordinates[1],
                    lon: f.geometry.coordinates[0],
                    pressure: f.properties.pressure_hpa,
                    speed: f.properties.speed_ms,
                    direction: f.properties.direction
                }));

                document.getElementById('statusText').innerText = "Loaded data.json";
                filterAndRender();
            } catch(e) {
                document.getElementById('statusText').innerText = "Fetch Error";
            }
        }

        function toggleRenderMode() {
            filterAndRender();
        }

        // --- OPTION 2 STREAMLINE INTEGRATION ENGINE ---

        // Convert Speed (m/s) & Direction (degrees) into U (E-W) and V (N-S) vector components
        function dirSpeedToUV(speed, dirDeg) {
            const rad = (dirDeg * Math.PI) / 180;
            const u = -speed * Math.sin(rad); // West-to-East component
            const v = -speed * Math.cos(rad); // South-to-North component
            return { u, v };
        }

        // Interpolate U & V components at point (lat, lon) using Inverse Distance Weighting (IDW)
        function interpolateUV(lat, lon, points) {
            let sumWeight = 0;
            let sumU = 0;
            let sumV = 0;
            const maxRadius = 8.0; // Max search radius in degrees (~880 km)
            const p = 2; // Distance power weighting factor

            for (let i = 0; i < points.length; i++) {
                const pt = points[i];
                const dLat = lat - pt.lat;
                const dLon = lon - pt.lon;
                const dist = Math.sqrt(dLat * dLat + dLon * dLon);

                if (dist > maxRadius) continue;
                if (dist < 0.01) return dirSpeedToUV(pt.speed, pt.direction); // Exceedingly close match

                const w = 1 / Math.pow(dist, p);
                const uv = dirSpeedToUV(pt.speed, pt.direction);

                sumWeight += w;
                sumU += uv.u * w;
                sumV += uv.v * w;
            }

            if (sumWeight === 0) return null; // Data gap (no observations within radius)

            return { u: sumU / sumWeight, v: sumV / sumWeight };
        }

        // Generate and trace forward streamline curves from seeded grid nodes
        function renderStreamlines(filteredPoints) {
            if (filteredPoints.length === 0) return 0;

            const gridSpacing = 2.0; // Grid step in degrees
            const maxSteps = 15;     // Segment steps per line
            const stepSize = 0.25;   // Distance delta per step in degrees
            let streamlineCount = 0;

            // Define grid extent covering West Pacific basin
            for (let lat = -5; lat <= 45; lat += gridSpacing) {
                for (let lon = 105; lon <= 175; lon += gridSpacing) {
                    
                    let currLat = lat;
                    let currLon = lon;
                    const path = [[currLat, currLon]];
                    let totalSpeed = 0;

                    for (let step = 0; step < maxSteps; step++) {
                        const uv = interpolateUV(currLat, currLon, filteredPoints);
                        if (!uv) break; // Terminate line if entering a data void

                        const speed = Math.sqrt(uv.u * uv.u + uv.v * uv.v);
                        if (speed < 1.0) break; // Terminate if wind is too calm (< 1 m/s)

                        totalSpeed += speed;

                        // Step forward along wind vector trajectory
                        const dLat = (uv.v / speed) * stepSize;
                        const dLon = (uv.u / speed) * stepSize;

                        currLat += dLat;
                        currLon += dLon;
                        path.push([currLat, currLon]);
                    }

                    // Render streamline curve if at least 3 valid trajectory points exist
                    if (path.length >= 3) {
                        streamlineCount++;
                        const avgSpeed = totalSpeed / (path.length - 1);

                        // Dynamic color scaling based on wind speed (m/s)
                        let color = '#38bdf8'; // Normal (Light Blue)
                        if (avgSpeed > 25) color = '#ef4444'; // Jetstream / High Wind (Red)
                        else if (avgSpeed > 15) color = '#f97316'; // Moderate (Orange)
                        else if (avgSpeed > 8) color = '#eab308'; // Light (Yellow)

                        // Render polyline path
                        const line = L.polyline(path, {
                            color: color,
                            weight: 2,
                            opacity: 0.8
                        });
                        amvLayerGroup.addLayer(line);

                        // Add directional arrowhead at stream midpoint
                        const midIndex = Math.floor(path.length / 2);
                        const p1 = path[midIndex];
                        const p2 = path[midIndex + 1];

                        if (p1 && p2) {
                            const angle = Math.atan2(p2[1] - p1[1], p2[0] - p1[0]) * (180 / Math.PI);
                            
                            const arrowIcon = L.divIcon({
                                className: 'stream-arrow',
                                html: `<div style="transform: rotate(${90 - angle}deg); transform-origin: center center;">
                                         <svg width="12" height="12" viewBox="0 0 10 10">
                                            <polygon points="5,0 10,10 5,7 0,10" fill="${color}"/>
                                         </svg>
                                       </div>`,
                                iconSize: [12, 12],
                                iconAnchor: [6, 6]
                            });

                            const arrowMarker = L.marker(p1, { icon: arrowIcon, interactive: false });
                            amvLayerGroup.addLayer(arrowMarker);
                        }
                    }
                }
            }
            return streamlineCount;
        }

        // Master Filter & Render Pipeline
        function filterAndRender() {
            amvLayerGroup.clearLayers();

            const activeLevels = {};
            document.querySelectorAll('.lvl-chk').forEach(chk => {
                if (chk.checked) activeLevels[parseInt(chk.value)] = true;
            });

            // Filter raw AMV observations to user-selected pressure tiers
            const filteredPoints = rawAMVData.filter(pt => {
                const lvl = snapToStandardLevel(pt.pressure);
                return activeLevels[lvl];
            });

            const mode = document.querySelector('input[name="mode"]:checked').value;
            let featureCount = 0;

            if (mode === 'streamlines') {
                featureCount = renderStreamlines(filteredPoints);
            } else {
                // Render standard Point Wind Barbs
                filteredPoints.forEach(pt => {
                    featureCount++;
                    const stdLvl = snapToStandardLevel(pt.pressure);
                    const color = getColorForLevel(stdLvl);
                    const svgHtml = createWindBarbSVG(pt.speed, pt.direction, color);

                    const icon = L.divIcon({
                        html: svgHtml,
                        className: 'wind-barb-icon',
                        iconSize: [40, 40],
                        iconAnchor: [20, 20]
                    });

                    const marker = L.marker([pt.lat, pt.lon], { icon: icon });
                    const speedKnots = Math.round(pt.speed * 1.94384);

                    marker.bindPopup(`
                        <strong>Satellite Wind Observation</strong><br/>
                        <b>Exact Pressure:</b> ${pt.pressure} hPa<br/>
                        <b>Matched Level:</b> ${stdLvl} hPa<br/>
                        <b>Wind Speed:</b> ${pt.speed} m/s (${speedKnots} kts)<br/>
                        <b>Direction:</b> ${pt.direction}°
                    `);

                    amvLayerGroup.addLayer(marker);
                });
            }

            document.getElementById('pointCount').innerText = featureCount;
        }

        fetchLiveData();
        setInterval(fetchLiveData, 600000);
    </script>
</body>
</html>
