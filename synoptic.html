<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>East Asia Synoptic Weather Map</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }
    #map {
      height: 100vh;
      width: 100vw;
      background: #090d16;
    }
    /* Floating Header Dashboard */
    .dashboard-panel {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 16px 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      max-width: 340px;
    }
    .dashboard-panel h1 {
      font-size: 1.1rem;
      font-weight: 600;
      color: #38bdf8;
      margin-bottom: 4px;
    }
    .dashboard-panel p {
      font-size: 0.8rem;
      color: #94a3b8;
    }
    .stats {
      display: flex;
      gap: 16px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
    .stat-item {
      display: flex;
      flex-direction: column;
    }
    .stat-value {
      font-weight: 700;
      font-size: 1.1rem;
      color: #f1f5f9;
    }
    .stat-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      color: #64748b;
    }

    /* Custom Leaflet Marker Styling */
    .station-marker {
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(15, 23, 42, 0.9);
      border: 1.5px solid #38bdf8;
      border-radius: 20px;
      padding: 2px 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
      white-space: nowrap;
      color: #fff;
      font-weight: 600;
      font-size: 11px;
    }
    .wind-arrow {
      display: inline-block;
      margin-left: 4px;
      font-size: 10px;
      color: #38bdf8;
    }

    /* Leaflet Popup Styling Override */
    .leaflet-popup-content-wrapper {
      background: #1e293b;
      color: #f8fafc;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .leaflet-popup-tip {
      background: #1e293b;
    }
    .popup-title {
      font-size: 14px;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 6px;
    }
    .popup-grid {
      display: grid;
      grid-template-columns: auto auto;
      gap: 4px 12px;
      font-size: 12px;
    }
    .popup-label {
      color: #94a3b8;
    }
    .popup-val {
      font-weight: 600;
      text-align: right;
    }
  </style>
</head>
<body>

  <div class="dashboard-panel">
    <h1>East Asia Synoptic Stream</h1>
    <p id="last-updated">Loading weather data...</p>
    <div class="stats">
      <div class="stat-item">
        <span class="stat-value" id="station-count">0</span>
        <span class="stat-label">Active Stations</span>
      </div>
      <div class="stat-item">
        <span class="stat-value" id="avg-temp">-- °C</span>
        <span class="stat-label">Avg Temp</span>
      </div>
    </div>
  </div>

  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Initialize Leaflet map centered over East Asia
    const map = L.map('map', {
      zoomControl: false
    }).setView([30.0, 115.0], 4);

    // Add Zoom controls to bottom-right
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    // Dark Map Base Tiles (CartoDB Dark Matter)
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap &copy; CARTO',
      subdomains: 'abcd',
      maxZoom: 19
    }).addTo(map);

    let geojsonLayer;

    // Returns temperature-dependent color scale
    function getTempColor(temp) {
      return temp > 30 ? '#ef4444' : // Hot (Red)
             temp > 20 ? '#f97316' : // Warm (Orange)
             temp > 10 ? '#eab308' : // Mild (Yellow)
             temp > 0  ? '#06b6d4' : // Cool (Cyan)
             '#3b82f6';  // Freezing (Blue)
    }

    async function loadSynopticData() {
      try {
        // Fetch generated synoptic_data.json (bypassing browser cache)
        const response = await fetch(`synoptic_data.json?t=${new Date().getTime()}`);
        if (!response.ok) throw new Error('Could not load synoptic_data.json');

        const data = await response.json();

        // Clear existing markers
        if (geojsonLayer) {
          map.removeLayer(geojsonLayer);
        }

        let totalTemp = 0;
        const totalStations = data.features.length;

        // Render GeoJSON Features
        geojsonLayer = L.geoJSON(data, {
          pointToLayer: function (feature, latlng) {
            const props = feature.properties;
            totalTemp += props.temp;

            const tempColor = getTempColor(props.temp);
            const windRotation = props.wind_dir;

            // Custom HTML Marker showing temperature and wind arrow
            const customIcon = L.divIcon({
              className: 'custom-station-icon',
              html: `
                <div class="station-marker" style="border-color: ${tempColor}">
                  <span>${props.temp}°C</span>
                  <span class="wind-arrow" style="transform: rotate(${windRotation}deg); display: inline-block;">↑</span>
                </div>
              `,
              iconSize: [60, 24],
              iconAnchor: [30, 12]
            });

            return L.marker(latlng, { icon: customIcon });
          },
          onEachFeature: function (feature, layer) {
            const p = feature.properties;
            
            // Popup Details
            const popupContent = `
              <div class="popup-title">${p.name || p.station_id}</div>
              <div class="popup-grid">
                <span class="popup-label">Station ID:</span><span class="popup-val">${p.station_id}</span>
                <span class="popup-label">Temperature:</span><span class="popup-val">${p.temp} °C</span>
                <span class="popup-label">Dewpoint:</span><span class="popup-val">${p.dewpoint} °C</span>
                <span class="popup-label">Sea Level Pressure:</span><span class="popup-val">${p.slp} hPa</span>
                <span class="popup-label">Wind:</span><span class="popup-val">${p.wind_dir}° at ${p.wind_spd} kt</span>
                <span class="popup-label">Report Time:</span><span class="popup-val">${p.time}</span>
              </div>
            `;
            layer.bindPopup(popupContent);
          }
        }).addTo(map);

        // Update Dashboard Summary Stats
        document.getElementById('station-count').innerText = totalStations;
        document.getElementById('avg-temp').innerText = totalStations > 0 
          ? (totalTemp / totalStations).toFixed(1) + ' °C' 
          : '-- °C';
        document.getElementById('last-updated').innerText = `Synced at ${new Date().toLocaleTimeString()}`;

      } catch (err) {
        console.error('Error rendering weather layer:', err);
        document.getElementById('last-updated').innerText = 'Waiting for synoptic_data.json...';
      }
    }

    // Initial Load & Auto-Refresh every 60 seconds
    loadSynopticData();
    setInterval(loadSynopticData, 60000);
  </script>
</body>
</html>
