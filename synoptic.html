<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>East Asia Real-Time Synoptic Surface Map (Wind Barbs)</title>
  
  <!-- Leaflet & MarkerCluster CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

  <style>
    body, html { margin: 0; padding: 0; height: 100%; font-family: sans-serif; }
    #map { width: 100%; height: 100vh; background: #111; }
    
    /* Station label displaying Temperature & Pressure beside the Wind Barb */
    .station-label {
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid #555;
      border-radius: 4px;
      color: #fff;
      padding: 2px 4px;
      font-size: 10px;
      white-space: nowrap;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- Leaflet, MarkerCluster, and Wind Barb Plugin JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/spatialsparks/Leaflet.windbarb@master/src/leaflet-windbarb.js"></script>

  <script>
    // 1. Initialize Leaflet Map centered on East Asia
    const map = L.map('map').setView([30.0, 115.0], 4);

    // 2. Base Tile Layer (CartoDB Dark Theme)
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap &copy; CARTO | Data: NOAA WMO GTS',
      maxZoom: 18
    }).addTo(map);

    // 3. Cluster Group for Stations
    const markersGroup = L.markerClusterGroup({
      maxClusterRadius: 35,
      spiderfyOnMaxZoom: true,
      showCoverageOnHover: false
    });
    map.addLayer(markersGroup);

    // Color code temperature
    function getTempColor(t) {
      if (t >= 30) return '#ff4d4d'; // Warm (Red)
      if (t >= 20) return '#ffaa00'; // Moderate (Orange)
      if (t >= 10) return '#00cccc'; // Cool (Cyan)
      if (t >= 0)  return '#3399ff'; // Cold (Blue)
      return '#e600e6';             // Freezing (Magenta)
    }

    // 4. Fetch and Plot GTS Synoptic Data
    async function loadSynopticData() {
      try {
        const response = await fetch('synoptic_data.json?cache=' + Date.now());
        if (!response.ok) throw new Error('Data file not found');
        
        const geojson = await response.json();
        markersGroup.clearLayers();

        const geoJsonLayer = L.geoJSON(geojson, {
          pointToLayer: function (feature, latlng) {
            const props = feature.properties;
            const tempColor = getTempColor(props.temp);

            // Create Meteorological Wind Barb Icon using plugin
            const barbIcon = L.WindBarb.icon({
              deg: props.wind_dir,       // Direction in degrees (0-360)
              speed: props.wind_spd,     // Wind speed in knots
              pointRadius: 4,            // Station circle radius
              strokeWidth: 2,            // Barb line thickness
              strokeLength: 18,          // Length of main shaft
              barbSpaceing: 4,           // Spacing between barbs
              barbHeight: 12,            // Barb length
              fillColor: tempColor,      // Color center circle by temperature
              color: tempColor           // Color barb lines by temperature
            });

            // Create marker with wind barb
            const marker = L.marker(latlng, { icon: barbIcon });

            // Attach tooltip showing Temperature and Pressure next to the barb
            marker.bindTooltip(`<b>${Math.round(props.temp)}°C</b> | ${props.slp}hPa`, {
              permanent: true,
              direction: 'right',
              offset: [10, -5],
              className: 'station-label'
            });

            // Popup details on click
            marker.bindPopup(`
              <div style="font-size: 13px; line-height: 1.5;">
                <strong style="font-size: 14px;">${props.name} (${props.station_id})</strong><br/>
                <b>Country:</b> ${props.country}<br/>
                <b>Obs Time:</b> ${props.time}<br/>
                <hr style="border: 0; border-top: 1px solid #ccc; margin: 5px 0;">
                <b>Temperature:</b> ${props.temp} °C<br/>
                <b>Dew Point:</b> ${props.dewpoint} °C<br/>
                <b>Pressure (SLP):</b> ${props.slp} hPa<br/>
                <b>Wind:</b> ${props.wind_dir}° at ${props.wind_spd} knots
              </div>
            `);

            return marker;
          }
        });

        markersGroup.addLayer(geoJsonLayer);
        console.log(`Rendered ${geojson.features.length} station wind barbs.`);

      } catch (err) {
        console.error('Error loading synoptic_data.json:', err);
      }
    }

    // Initial load + automatically refresh map every 5 minutes
    loadSynopticData();
    setInterval(loadSynopticData, 300000);
  </script>
</body>
</html>
