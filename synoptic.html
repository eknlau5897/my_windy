<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>East Asia Synoptic Map + NASA GIBS H9 Band 13</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- MarkerCluster CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

  <!-- Leaflet & MarkerCluster JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <style>
    body, html {
      margin: 0; padding: 0;
      height: 100%; width: 100%;
      overflow: hidden;
      background-color: #050814;
    }
    
    #map {
      height: 100vh;
      width: 100vw;
    }

    /* WMO Standard Synoptic Station Plot Layout */
    .station-plot {
      position: relative;
      width: 80px;
      height: 80px;
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      font-size: 11px;
    }
    
    .station-dot {
      position: absolute;
      top: 36px; left: 36px;
      width: 8px; height: 8px;
      background: #ffffff;
      border: 1px solid #000000;
      border-radius: 50%;
      z-index: 2;
    }

    /* Text contrast adjusted for imagery overlay */
    .temp { position: absolute; top: 18px; left: 10px; color: #ff5252; text-shadow: 1px 1px 2px #000; }
    .dewpoint { position: absolute; bottom: 18px; left: 10px; color: #69f0ae; text-shadow: 1px 1px 2px #000; }
    .slp { position: absolute; top: 18px; right: 10px; color: #448aff; text-shadow: 1px 1px 2px #000; }
  </style>
</head>
<body>

<div id="map"></div>

<script>
  // 1. Define Strict Spatial Bounding Box: 0-60N, 80-145E
  const southWest = L.latLng(0, 80);
  const northEast = L.latLng(60, 145);
  const regionBounds = L.latLngBounds(southWest, northEast);

  // 2. Initialize Map
  const map = L.map('map', {
    preferCanvas: true,
    maxBounds: regionBounds,
    maxBoundsViscosity: 1.0,
    minZoom: 4,
    maxZoom: 10
  }).fitBounds(regionBounds);

  // 3. Base Map Layers
  const osmBase = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors',
    bounds: regionBounds
  });

  // Calculate current date string in YYYY-MM-DD for GIBS WMS TIME parameter
  const todayStr = new Date().toISOString().split('T')[0];

  // 4. NASA GIBS WMS Himawari-9 Band 13 (Clean Infrared) Layer
  const gibsH9Band13 = L.tileLayer.wms('https://gibs.earthdata.nasa.gov/wms/epsg3857/best/wms.cgi', {
    layers: 'Himawari9_AHI_Band13_Clean_Infrared',
    format: 'image/png',
    transparent: true,
    time: todayStr,
    attribution: 'Imagery © <a href="https://earthdata.nasa.gov/gibs">NASA GIBS</a> / JMA',
    bounds: regionBounds,
    opacity: 0.75,
    zIndex: 1
  }).addTo(map);

  // Layer Control Setup
  const baseMaps = { "OpenStreetMap": osmBase };
  const overlayMaps = { "NASA GIBS Himawari-9 Band 13 (IR)": gibsH9Band13 };
  L.control.layers(baseMaps, overlayMaps, { collapsed: false }).addTo(map);

  // Add OSM default below satellite
  osmBase.addTo(map);

  // 5. MarkerCluster Layer for Observations
  const markersCluster = L.markerClusterGroup({
    disableClusteringAtZoom: 8,
    spiderfyOnMaxZoom: true,
    showCoverageOnHover: false
  });
  map.addLayer(markersCluster);

  // 6. SVG Wind Barb Generator (White strokes for dark IR imagery visibility)
  function createWindBarbSVG(dir, spd) {
    let barbsHTML = '';
    let currentY = 10;
    let speed = spd;

    while (speed >= 50) {
      barbsHTML += `<polygon points="20,${currentY} 35,${currentY + 4} 20,${currentY + 8}" fill="#ffffff" stroke="#000" stroke-width="0.5" />`;
      currentY += 10; speed -= 50;
    }
    while (speed >= 10) {
      barbsHTML += `<line x1="20" y1="${currentY}" x2="35" y2="${currentY - 5}" stroke="#ffffff" stroke-width="2.5" />`;
      currentY += 6; speed -= 10;
    }
    if (speed >= 5) {
      barbsHTML += `<line x1="20" y1="${currentY}" x2="28" y2="${currentY - 3}" stroke="#ffffff" stroke-width="2.5" />`;
    }

    return `
      <svg style="position: absolute; top:0; left:0; width:80px; height:80px; pointer-events:none; transform: rotate(${dir}deg); transform-origin: 40px 40px;" viewBox="0 0 80 80">
        <line x1="40" y1="40" x2="20" y2="10" stroke="#ffffff" stroke-width="2.5" />
        <g transform="translate(20,10) rotate(-60)">${barbsHTML}</g>
      </svg>`;
  }

  // 7. Load Live Synoptic Plots
  function loadLiveData() {
    const url = 'synoptic_data.json?t=' + new Date().getTime();

    fetch(url)
      .then(res => res.json())
      .then(data => {
        markersCluster.clearLayers();

        const geojsonLayer = L.geoJSON(data, {
          pointToLayer: function (feature, latlng) {
            const p = feature.properties;
            const slpFormatted = String(p.slp).replace('.', '').slice(-3);

            const html = `
              <div class="station-plot">
                <div class="temp">${p.temp}°</div>
                <div class="dewpoint">${p.dewpoint}°</div>
                <div class="slp">${slpFormatted}</div>
                <div class="station-dot"></div>
                ${createWindBarbSVG(p.wind_dir, p.wind_spd)}
              </div>`;

            const customIcon = L.divIcon({
              html: html,
              className: '',
              iconSize: [80, 80],
              iconAnchor: [40, 40]
            });

            return L.marker(latlng, { icon: customIcon })
              .bindPopup(`
                <b>Station ID:</b> ${p.station_id}<br>
                <b>Obs Time:</b> ${p.time}<br>
                <b>Temperature:</b> ${p.temp} °C<br>
                <b>Dew Point:</b> ${p.dewpoint} °C<br>
                <b>Pressure:</b> ${p.slp} hPa<br>
                <b>Wind:</b> ${p.wind_dir}° at ${p.wind_spd} kts
              `);
          }
        });

        markersCluster.addLayer(geojsonLayer);
      })
      .catch(err => console.error("Error updating station layer:", err));
  }

  loadLiveData();
  setInterval(loadLiveData, 60000);
</script>

</body>
</html>
