<!DOCTYPE html>
<html>
<head>
    <title>Windy API Smooth Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/leaflet@1.4.0/dist/leaflet.js"></script>
    <script src="https://api.windy.com/assets/map-forecast/libBoot.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; }
        #windy { width: 100vw; height: 100vh; }
        #controls { position: absolute; top: 10px; left: 10px; z-index: 1000; background: rgba(0,0,0,0.7); padding: 10px; border-radius: 5px; color: white; }
        #cursor-label { position: absolute; z-index: 2000; pointer-events: none; background: rgba(0,0,0,0.8); color: #fff; padding: 5px 10px; border-radius: 4px; display: none; font-size: 13px; border: 1px solid #444; }
        button { cursor: pointer; padding: 5px 10px; margin: 2px; border: none; border-radius: 3px; }
    </style>
</head>
<body>

    <div id="windy"></div>
    <div id="cursor-label"></div>

    <div id="controls">
        <button onclick="changeOverlay('wind')">Wind</button>
        <button onclick="changeOverlay('temp')">Temp</button>
        <button id="toggleRadar">Toggle Radar</button>
    </div>

    <script>
        let windyStore, radarLayer;

        const options = {
            key: 'oY3mEEE9INICIpQQi8QvQlDJA365LMC3', // Replace with your actual key
            lat: 22.3,
            lon: 114.17,
            zoom: 5
            // --- SMOOTH ZOOM SETTINGS ---
        };

       windyInit(options, windyAPI => {
    const { map, store } = windyAPI;
    store.set('overlay', 'wind');

    const intensityStyles = {
        "T.D.":    { color: '#808080', radius: 8, name: 'Tropical Depression' },
        "T.S.":    { color: '#008000', radius: 8, name: 'Tropical Storm' },
        "S.T.S.":  { color: '#0000FF', radius: 8, name: 'Severe Tropical Storm' },
        "T.":      { color: '#FFC000', radius: 8, name: 'Typhoon' },
        "S.T.":    { color: '#FF0000', radius: 8, name: 'Severe Typhoon' },
        "SuperT.": { color: '#800080', radius: 8, name: 'Super Typhoon' },
        "ViolentT.": {color: '#000000', radius: 8, name: 'Violent Typhoon'}
    };

    // Error radii in meters (12h, 24h, 48h, etc.)
    //const forecastErrorRadii = { 0: 0, 24: 150000, 48: 180000, 72: 280000, 96: 380000, 120: 450000 };

    const pastTrack = [
        { lat: 8.6, lon: 153, intensity: "T.D.", wind: 45 ,pressure:1002,hour: 8-4 1200},
        { lat: 8.7, lon: 152.1, intensity: "T.D.", wind: 50 ,pressure:1002,hour: 9-4 00},
        { lat: 8, lon: 151.3, intensity: "T.D.", wind: 60 ,pressure:1000,hour:9-4 12},
        { lat: 8, lon: 151, intensity: "T.D.", wind: 60 ,pressure:998, hour:10-4 00},
        { lat: 8, lon: 150.4, intensity: "T.S.", wind: 65 ,pressure:996, hour:10-4 06},
	{ lat: 8.1, lon: 150.6, intensity: "S.T.S.", wind: 105 ,pressure:982,hour:10-4 12},
    { lat: 8.1, lon: 151.3, intensity: "S.T.S.", wind: 105 ,pressure:980, hour:10-4 18},
    { lat: 8.4, lon: 151.5, intensity: "S.T.S.", wind: 110 ,pressure:978, hour:11-4 00},
		{ lat: 8.7, lon: 151.6, intensity: "T.", wind: 130 ,pressure:965, hour:11-4 12},
		{ lat: 8.9, lon: 151.4, intensity: "T.", wind: 145 ,pressure:960, hour:11-4 18},
		{ lat: 9.9, lon: 151, intensity: "S.T.", wind: 180 ,pressure:940, hour:12-4 00},
        { lat: 10.2, lon: 150.8, intensity: "SuperT.", wind: 220 ,pressure:915, hour:12-4 06},
        { lat: 10.5, lon: 150.5, intensity: "ViolentT.", wind: 265 ,pressure:898, hour:12-4 09},
		{ lat: 11.1, lon: 150.2, intensity: "ViolentT.", wind: 265 ,pressure:898, hour:12-4 12},
		{ lat: 11.6, lon: 149.5, intensity: "ViolentT.", wind: 275 ,pressure:894, hour:12-4 18},
		{ lat: 12.1, lon: 148.5, intensity: "ViolentT.", wind: 265 ,pressure:898, hour:13-4 00},
		{ lat: 12.1, lon: 148.5, intensity: "ViolentT.", wind: 255 ,pressure:902, hour:13-4 08}
    ];

    // Added 'hour' property to forecastTrack for the cone calculation
    const forecastTrack = [
        { lat: 12.8, lon: 147.8, intensity: "ViolentT.", wind: 255 ,pressure:902,hour:13-4 08},
        { lat: 14.9, lon: 146.1, intensity: "ViolentT.", wind: 240,pressure: 905, hour:T24 },
        { lat: 16.5, lon: 144.7,intensity: "SuperT.", wind: 205, pressure:920, hour: T48 },
        { lat: 19.1,lon: 144, intensity: "S.T.", wind: 170, pressure:948, hour: T72 },
        { lat: 21.3,lon: 145.2, intensity: "T.", wind: 130, pressure:970, hour: T96 },
        { lat: 24,lon: 146.5,intensity: "S.T.S.", wind: 110, pressure:978,hour: T120 }
    ];

    // --- 1. DRAW UNCERTAINTY CONE ---

    // --- 2. TRACK VISUALS ---
    L.circle([22.3193, 114.1694], { color: '#000000', fillOpacity: 0.05, radius: 800000, weight: 1 }).addTo(map);
    L.polyline(pastTrack.map(p => [p.lat, p.lon]), { color: '#333', weight: 2 }).addTo(map);
    const forecastLine = L.polyline([], { color: 'red', weight: 2, dashArray: '5, 10' }).addTo(map);

    function addMarker(point, isPast) {
        const style = intensityStyles[point.intensity] || { color: '#fff', radius: 4, name: 'Unknown' };
        const marker = L.circleMarker([point.lat, point.lon], {
            radius: style.radius,
            fillColor: style.color,
            color: isPast ? '#000' : 'red',
            weight: 1.5,
            fillOpacity: 1
        }).addTo(map);

        //marker.bindTooltip(`${point.wind} km/h`, { permanent: true, direction: 'right', className: 'wind-label', offset: [10, 0] });
        marker.bindPopup(`<b>${style.name}</b><br>Wind: ${point.wind} km/h,Pressure:${point.pressure}`);
    }

    // --- 3. EXECUTION ---
    pastTrack.forEach(p => addMarker(p, true));

    let step = 0;
    function animateForecast() {
        if (step < forecastTrack.length) {
            forecastLine.addLatLng([forecastTrack[step].lat, forecastTrack[step].lon]);
            addMarker(forecastTrack[step], false);
            step++;
            setTimeout(animateForecast, 600);
        }
    }
    animateForecast();


    // 7. RainViewer Radar Logic
    const updateRadar = () => {
    fetch('https://api.rainviewer.com/public/weather-maps.json')
        .then(res => res.json())
        .then(data => {
            const latest = data.radar.past.pop();
            const radarUrl = `${data.host}${latest.path}/1024/{z}/{x}/{y}/2/1_1.png`;
            
            if (window.radarLayer) map.removeLayer(window.radarLayer);
            
            window.radarLayer = L.tileLayer(radarUrl, { 
                opacity: 0.5,
                maxZoom:11,
                maxNativeZoom:7,
                zIndex: 100 // Ensure radar stays above the wind overlay
            }).addTo(map);
        })
        .catch(err => console.error("Radar failed:", err));
};
updateRadar();
});

updateRadar();
    </script>
</body>
</html>
