    function drawUncertaintyCone(track, errors) {

    const rightPoints = [];

        const radius = errors[i] || 0;

		// 1. Create a simple HTML element to follow the mouse
		function addNasaToWindyMenu(map, layerID, label) {
    // 1. Create the NASA Layer (hidden by default)
    const nasaLayer = L.tileLayer.wms('https://nasa.gov', {
        layers: layerID,
        format: 'image/png',
        transparent: true,
        opacity: 0.8,
        attribution: 'NASA'
    });

    // 2. Function to inject the button into the DOM
    const injectButton = () => {
        // Search for the Windy menu container
        const menu = document.querySelector('.menu-content') || document.querySelector('.layers-list');
        if (!menu) return;

        // Check if button already exists to avoid duplicates
        if (document.getElementById(`btn-${layerID}`)) return;

        const btn = document.createElement('div');
        btn.id = `btn-${layerID}`;
        btn.className = 'menu-item'; // Matches Windy's native button class
        btn.style.cssText = 'cursor: pointer; padding: 10px; margin-top: 5px; border-radius: 4px; background: #333; transition: 0.3s;';
        btn.innerHTML = `<span>${label}</span>`;

        // 3. Toggle Logic
        btn.onclick = () => {
            if (map.hasLayer(nasaLayer)) {
                map.removeLayer(nasaLayer);
                btn.style.background = '#333'; // Reset to dark
                btn.style.color = 'white';
            } else {
                map.addLayer(nasaLayer);
                btn.style.background = '#e67e22'; // Matches Windy orange
                btn.style.color = 'white';
            }
        };

        menu.appendChild(btn);
    };

    // Run injection. We use an interval because Windy's menu often 
    // re-renders when the user interacts with it.
    setInterval(injectButton, 2000);
}
    // 2. RADAR LOGIC

		// URL Template for NASA GIBS
	
function showFrame(index) {
            // 隱藏當前圖層
            if (radarLayers[currentIndex]) {
                radarLayers[currentIndex].layer.setOpacity(0);
            }
            
            // 顯示新圖層
            currentIndex = index;
            radarLayers[currentIndex].layer.setOpacity(0.7);
            updateLabel();
        }

        function updateLabel() {
            const label = document.getElementById('time-label');
            if (radarLayers[currentIndex]) {
                label.innerText = radarLayers[currentIndex].time;
            }
        }

        function toggleAnimation() {
            const btn = document.getElementById('play-pause');
            if (isPlaying) {
                clearInterval(animationInterval);
                btn.innerText = "Play";
            } else {
                btn.innerText = "Pause";
                animationInterval = setInterval(() => {
                    let next = (currentIndex + 1) % radarLayers.length;
                    showFrame(next);
                }, 500); // 500ms 切換一幀
            }
            isPlaying = !isPlaying;
        };

// 4. OVERLAY SWITCHER
function changeOverlay(type) {
    if (windyStore) {
        windyStore.set('overlay', type);
