<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Leaflet.awesome-markers/2.0.2/leaflet.awesome-markers.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://netdna.bootstrapcdn.com/bootstrap/3.0.0/css/bootstrap-glyphicons.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.2.0/css/all.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/Leaflet.awesome-markers/2.0.2/leaflet.awesome-markers.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/python-visualization/folium/folium/templates/leaflet.awesome.rotate.min.css"/>
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <style>
        #map_d9b7c97eb2d3d7e0befce17df6a8eadc {
            position: relative;
            width: 100.0%;
            height: 100.0%;
            left: 0.0%;
            top: 0.0%;
        }
        .leaflet-container { font-size: 1rem; }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }
    </style>

    <script>
        L_NO_TOUCH = false;
        L_DISABLE_3D = false;
    </script>
</head>
<body>
    <div class="folium-map" id="map_d9b7c97eb2d3d7e0befce17df6a8eadc"></div>
</body>
<script>
    // Initialize map zoomed out to global level
    var map = L.map(
        "map_d9b7c97eb2d3d7e0befce17df6a8eadc",
        {
            center: [20.0, 0.0],
            crs: L.CRS.EPSG3857,
            zoom: 3,
            zoomControl: true,
            preferCanvas: false,
        }
    );

    var tileLayer = L.tileLayer(
        "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",
        {
            minZoom: 0,
            maxZoom: 20,
            maxNativeZoom: 20,
            noWrap: false,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
            subdomains: "abcd",
            opacity: 1,
        }
    );
    tileLayer.addTo(map);

    // Layer Group to hold all dynamic GTS observations globally
    var gtsLayerGroup = L.layerGroup().addTo(map);

    // Helper function: Render station plot icon
    function createGTSStationIcon(station) {
        var temp = station.temp !== undefined ? station.temp.toFixed(1) : '--';
        var dewpoint = station.dewpoint !== undefined ? station.dewpoint.toFixed(1) : '--';
        var pressure = station.slp !== undefined ? station.slp.toFixed(1) : '--';
        var windDir = station.windDir || 0;
        var stationId = station.id || 'N/A';

        return L.divIcon({
            "html": `
            <div style="position: relative; width: 60px; height: 60px; font-family: Arial; font-weight: bold; font-size: 10px;">
                <!-- Temperature (NW Corner) -->
                <div style="position: absolute; top: 5px; left: 0; color: darkred;">${temp}</div>
                
                <!-- Dewpoint (SW Corner) -->
                <div style="position: absolute; bottom: 5px; left: 0; color: darkgreen;">${dewpoint}</div>

                <!-- Sea Level Pressure / SLP (NE Corner) -->
                <div style="position: absolute; top: 5px; right: 0; color: darkblue;">${pressure}</div>
                
                <!-- GTS Station Center Marker -->
                <div style="position: absolute; top: 25px; left: 25px; width: 8px; height: 8px; background-color: #e74c3c; border: 1px solid black; border-radius: 50%;"></div>
                
                <!-- Wind Barb / Vector Direction -->
                <div style="position: absolute; top: 28px; left: 29px; width: 2px; height: 25px; background-color: black; transform-origin: top center; transform: rotate(${windDir}deg); border-radius: 1px;">
                    <div style="width: 8px; height: 2px; background-color: black; position: absolute; bottom: 0; right: 0;"></div>
                </div>
                
                <!-- WMO Station ID (Right) -->
                <div style="position: absolute; top: 25px; left: 38px; font-size: 8px; color: #333;">${stationId}</div>
            </div>`,
            "iconSize": [60, 60],
            "iconAnchor": [30, 30],
            "className": "empty",
        });
    }

    // Function to load global GTS weather data asynchronously
    async function fetchGlobalGTSObservations() {
        try {
            // Replace endpoint URL with your backend GTS feed API URL (GeoJSON or JSON endpoint)
            // Example response structure expected: Array of station objects with lat, lon, temp, dewpoint, slp, windDir, id, rawMsg
            
            // DEMO DATA: Simulating a global feed payload
            const globalGTSData = [
                { id: "59287", lat: 23.13, lon: 113.26, temp: 23.8, dewpoint: 18.2, slp: 1012.4, windDir: 140, rawMsg: "AAXX 15034 59287 11583 81404 10238 20182 40124 58003" },
                { id: "47662", lat: 35.67, lon: 139.65, temp: 16.4, dewpoint: 10.1, slp: 1018.2, windDir: 40, rawMsg: "AAXX 15034 47662 11583 80404 10164 20101 40182" },
                { id: "07149", lat: 48.85, lon: 2.35, temp: 12.0, dewpoint: 8.5, slp: 1021.0, windDir: 220, rawMsg: "AAXX 15034 07149 11583 82204 10120 20085 40210" },
                { id: "72502", lat: 40.71, lon: -74.00, temp: 18.5, dewpoint: 12.0, slp: 1009.8, windDir: 280, rawMsg: "AAXX 15034 72502 11583 82804 10185 20120 40098" },
                { id: "94768", lat: -33.86, lon: 151.20, temp: 21.0, dewpoint: 15.3, slp: 1016.5, windDir: 180, rawMsg: "AAXX 15034 94768 11583 81804 10210 20153 40165" }
            ];

            // Clear existing GTS markers before re-rendering
            gtsLayerGroup.clearLayers();

            // Iterate over all global observations and add markers
            globalGTSData.forEach(station => {
                var marker = L.marker([station.lat, station.lon]);
                
                // Assign icon
                marker.setIcon(createGTSStationIcon(station));

                // Assign popup with raw GTS/SYNOP payload
                var popupContent = `
                    <div style="width: 100%;">
                        <strong>WMO Station ${station.id}:</strong><br/>
                        <code>${station.rawMsg || 'No raw data available'}</code>
                    </div>
                `;
                marker.bindPopup(popupContent);

                // Add to layer group
                gtsLayerGroup.addLayer(marker);
            });

        } catch (error) {
            console.error("Failed to load global GTS weather data:", error);
        }
    }

    // Call dynamic fetch on page load
    fetchGlobalGTSObservations();
</script>
</html>
