<!DOCTYPE html>
<html>
<head>
    <title>Windy API Smooth Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/leaflet@1.4.0/dist/leaflet.js"></script>
    <script src="https://api.windy.com/assets/map-forecast/libBoot.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; }
        #windy { width: 100vw; height: 100vh; }
        #controls { 
            position: absolute; top: 10px; left: 10px; z-index: 1000; 
            background: rgba(0,0,0,0.85); padding: 12px; border-radius: 4px; 
            color: white; display: flex; flex-direction: column; gap: 8px; width: 80px;
        }
        button { 
            cursor: pointer; padding: 10px; border: none; border-radius: 4px; 
            background: #333; color: white; font-weight: bold; transition: 0.3s; 
        }
        button:hover { background: #555; }
        .active { background: #e67e22 !important; }
        .section-label { font-size: 10px; text-transform: uppercase; color: #aaa; margin-top: 5px; }
    </style>
</head>
<body>

    <div id="windy"></div>
    <div id="cursor-label"></div>

    <div id="controls">
        <div class="section-label">Overlays</div>
        <button id="btn-wind" class="active" onclick="changeOverlay('wind')">Wind</button>
        <button id="btn-temp" onclick="changeOverlay('temp')">Temperature</button>
        
        <div class="section-label">Satellite & Radar</div>
		<button id="addNasaToWindyMenu" onclick="addNasaToWindyMenu()">satellite image</button>
        <button id="toggleRadar" onclick="toggleRadar()">Rain Radar</button>
    </div>

    <script>
        let windyStore, radarLayer;
		let leafletMap; // Global reference for the toggle function

const options = {
    key: 'oY3mEEE9INICIpQQi8QvQlDJA365LMC3',
    lat: 22.3,
    lon: 114.17,
    zoom: 5
};
windyInit(options, windyAPI => {
    // 1. Assign global references from the API
    const { map, store,picker,utils } = windyAPI;
    leafletMap = map;
    windyStore = store;
	windyAPI.colors.wind.changeColor([
    [0,   [255, 255, 255]],    // Deep Blue (Calm)
    [7,   [0, 128, 255]],  // Medium Blue
    [15,  [0, 255, 255]],  // Cyan (Light Breeze)
    [22,  [0, 255, 128]],  // Spring Green
    [29,  [0, 255, 0]],    // Green (Moderate)
    [35,  [128, 255, 0]],  // Lime
    [42,  [255, 255, 0]],  // Yellow (Strong)
    [48,  [255, 128, 0]],  // Orange (Near Gale)
    [55,  [255, 0, 0]],    // Red (Gale/Storm)
    [64,  [255, 0, 255]],  // Magenta (Violent Storm)
    [85,  [255, 200, 255]],// Light Pink
    [100,  [255, 255, 255]] // White (Hurricane Force)
]);
    // 2. Now you can use map.on or other functions
    store.set('overlay', 'wind');
	store.set('isolines', 'pressure');

// Add temperature isolines
    // --- TYPHOON TRACK DATA & VISUALS ---
    const intensityStyles = {
        "T.D.":    { color: '#808080', radius: 8, name: 'Tropical Depression' },
        "T.S.":    { color: '#008000', radius: 8, name: 'Tropical Storm' },
        "S.T.S.":  { color: '#0000FF', radius: 8, name: 'Severe Tropical Storm' },
        "T.":      { color: '#FFC000', radius: 8, name: 'Typhoon' },
        "S.T.":    { color: '#FF0000', radius: 8, name: 'Severe Typhoon' },
        "SuperT.": { color: '#800080', radius: 8, name: 'Super Typhoon' },
        "ViolentT.": {color: '#000000', radius: 8, name: 'Violent Typhoon'}
    };

    const pastTrack = [
        { lat: 8.6, lon: 153, intensity: "T.D.", wind: 45 ,pressure:1002,hour: "8-4 12Z"},
        { lat: 8.7, lon: 152.1, intensity: "T.D.", wind: 50 ,pressure:1002,hour: "9-4 00Z"},
        { lat: 8, lon: 151.3, intensity: "T.D.", wind: 60 ,pressure:1000,hour:"9-4 12Z"},
        { lat: 8, lon: 151, intensity: "T.D.", wind: 60 ,pressure:998, hour:"10-4 00Z"},
        { lat: 8, lon: 150.4, intensity: "T.S.", wind: 65 ,pressure:996, hour:"10-4 06Z"},
        { lat: 8.1, lon: 150.6, intensity: "S.T.S.", wind: 105 ,pressure:982,hour:"10-4 12Z"},
        { lat: 8.1, lon: 151.3, intensity: "S.T.S.", wind: 105 ,pressure:980, hour:"10-4 18Z"},
        { lat: 8.4, lon: 151.5, intensity: "S.T.S.", wind: 110 ,pressure:978, hour:"11-4 00Z"},
        { lat: 8.7, lon: 151.6, intensity: "T.", wind: 130 ,pressure:965, hour:"11-4 12Z"},
        { lat: 8.9, lon: 151.4, intensity: "T.", wind: 145 ,pressure:960, hour:"11-4 18Z"},
        { lat: 9.9, lon: 151, intensity: "S.T.", wind: 180 ,pressure:940, hour:"12-4 00Z"},
        { lat: 10.2, lon: 150.8, intensity: "SuperT.", wind: 220 ,pressure:915, hour:"12-4 06Z"},
        { lat: 10.5, lon: 150.5, intensity: "ViolentT.", wind: 265 ,pressure:898, hour:"12-4 09Z"},
        { lat: 11.1, lon: 150.2, intensity: "ViolentT.", wind: 265 ,pressure:898, hour:"12-4 12Z"},
        { lat: 11.6, lon: 149.5, intensity: "ViolentT.", wind: 275 ,pressure:894, hour:"12-4 18Z"},
        { lat: 12.1, lon: 148.5, intensity: "ViolentT.", wind: 265 ,pressure:898, hour:"13-4 00Z"},
        { lat: 12.8, lon: 147.8, intensity: "ViolentT.", wind: 255 ,pressure:902, hour:"13-4 08Z"},
        { lat: 13.1, lon: 147.6, intensity: "ViolentT.", wind: 250 ,pressure:905, hour:"13-4 12Z"},
        { lat: 13.9, lon: 146.8, intensity: "ViolentT.", wind: 250 ,pressure:905, hour:"13-4 21Z"},
        { lat: 14.3, lon: 146.6, intensity: "SuperT.", wind: 230 ,pressure:915, hour:"14-4 00Z"},
		{ lat: 14.5, lon: 146.2, intensity: "SuperT.", wind: 220 ,pressure:920, hour:"14-4 03Z"},
		{ lat: 14.7, lon: 145.9, intensity: "SuperT.", wind: 205 ,pressure:928, hour:"14-4 09Z"},
		{ lat: 15.2, lon: 145.8, intensity: "SuperT.", wind: 200 ,pressure:932, hour:"14-4 12Z"},
		{ lat: 15.5, lon: 145.3, intensity: "SuperT.", wind: 190 ,pressure:940, hour:"14-4 18Z"},
		{ lat: 15.6, lon: 145.2, intensity: "S.T.", wind: 180 ,pressure:945, hour:"15-4 00Z"},
        { lat: 16.2, lon: 144.6, intensity: "S.T.", wind: 180 ,pressure:945, hour:"15-4 12Z"},
        { lat: 17.2, lon: 144.4, intensity: "S.T.", wind: 165 ,pressure:950, hour:"16-4 00Z"},
		{ lat: 19.4, lon: 145.2, intensity: "T.", wind: 130 ,pressure:968, hour:"17-4 00Z"},
        { lat: 22.2, lon: 146.5, intensity: "S.T.S.", wind: 105, pressure:982, hour:"18-4 00Z"},
        { lat: 26.4, lon: 149.5, intensity: "T.S.", wind: 80, pressure:990, hour:"19-4 00Z"}
    ];  

    const forecastTrack = [
        { lat: 26.4, lon: 149.5, intensity: "T.S.", wind: 80, pressure:990, hour:"19-4 00Z"},
        { lat: 29.2, lon: 157.8, intensity: "T.S.", wind: 80,pressure: 990, hour:"20-4 00Z"}
    ];
	
    const forecastErrors = [0, 100000];
    map.createPane('topLabels');
map.getPane('topLabels').style.zIndex = 650; // Above vectors (400) and markers (600)
map.getPane('topLabels').style.pointerEvents = 'none';
    // Static Visuals
    L.circle([22.3025, 114.17], { color: '#000', fillOpacity: 0.05, radius: 800000, weight: 1 }).addTo(map);
	L.circle([22.3025, 114.17], { color: '#0000FF', fillOpacity: 0.05, radius: 400000, weight: 1 }).addTo(map);
	L.circle([22.3025, 114.17], { color: '#FF0000', fillOpacity: 0.05, radius: 200000, weight: 1 }).addTo(map);
	L.circle([22.3025, 114.17], { color: '#800080', fillOpacity: 0.05, radius: 100000, weight: 1 }).addTo(map);
    L.polyline(pastTrack.map(p => [p.lat, p.lon]), { color: '#333', weight: 2 }).addTo(map);
    const forecastLine = L.polyline([], { color: 'red', weight: 2, dashArray: '5, 10' }).addTo(map);

    function addMarker(point, isPast, isForecast) {
    const style = intensityStyles[point.intensity] || { color: '#fff', radius: 4, name: 'Unknown' };
    
    const marker = L.circleMarker([point.lat, point.lon], {
        radius: style.radius,
        fillColor: style.color,
        color: isPast ? '#000' : 'red',
        weight: 1.5,
        fillOpacity: 1
    }).addTo(map);

    marker.bindPopup(
        `<b>${style.name}</b><br>Wind: ${point.wind} km/h,Pressure:${point.pressure}hPa, Time: ${point.hour}`, 
        { 
            pane: 'topLabels',     // CRITICAL: Keeps it above the uncertainty cone
            autoClose: true,      // Keeps both past and forecast labels open
            closeOnClick: true,   // Stops map clicks from hiding them
            offset: [0, -5] 
        }
    ).openPopup();
}
    pastTrack.forEach(p => addMarker(p, true));

    function drawUncertaintyCone(track, errors) {
    const leftPoints = [];
    const rightPoints = [];

    track.forEach((point, i) => {
        const radius = errors[i] || 0;
        if (radius === 0) {
            leftPoints.push([point.lat, point.lon]);
            rightPoints.unshift([point.lat, point.lon]);
            return;
        }

        // 1. Get direction of the track at this point
        let angle;
        if (i < track.length - 1) {
            // Angle to next point
            angle = Math.atan2(track[i+1].lon - point.lon, track[i+1].lat - point.lat);
        } else {
            // Angle from previous point (for the final tip)
            angle = Math.atan2(point.lon - track[i-1].lon, point.lat - track[i-1].lat);
        }

        // 2. Convert meters to lat/lon degrees (approximation)
        const latOff = radius / 111320;
        const lonOff = radius / (111320 * Math.cos(point.lat * Math.PI / 180));

        // 3. Offset points perpendicular to the direction (90 degrees / PI/2)
        leftPoints.push([
            point.lat + latOff * Math.cos(angle + Math.PI / 2),
            point.lon + lonOff * Math.sin(angle + Math.PI / 2)
        ]);
        rightPoints.unshift([
            point.lat + latOff * Math.cos(angle - Math.PI / 2),
            point.lon + lonOff * Math.sin(angle - Math.PI / 2)
        ]);
		const warningMarker_1 = L.marker([24.5, 114.4]).addTo(map);

    // 2. Add the popup label
    warningMarker_1.bindPopup("No warning/watch for Guangdong");
    // Combine for a smooth closed loop
    
        const warningMarker_2= L.marker([22.4, 114.17]).addTo(map);
    warningMarker_2.bindPopup("No warning/watch for Hong Kong");
    
        const warningMarker_3= L.marker([22.18, 113.53]).addTo(map);
    warningMarker_3.bindPopup("No warning/watch for Macau");

        const warningMarker_4= L.marker([40, 114]).addTo(map);
    warningMarker_4.bindPopup("降溫警報：華北,source:forecast model, valid until 19/4 16Z<br>強烈北風潮注意報：華北,source:forecast model,valid until 19/4 16Z<br>沙塵暴警報：華北,source:forecast model,valid until 19/4 16Z");
        const warningMarker_5= L.marker([40, 95]).addTo(map);
    warningMarker_5.bindPopup("降溫警報：西北,source:forecast model, valid until 19/4 16Z<br>強烈北風潮注意報：西北,source:forecast model,valid until 19/4 16Z<br>沙塵暴警報：西北,source:forecast model,valid until 19/4 16Z");
        
    });
        
    const coneCoords = leftPoints.concat(rightPoints);
    // Combine for a smooth closed loop
    L.polygon(coneCoords, {
        color: '#ff0000',
        weight: 1.5,
        fillColor: '#ff0000',
        fillOpacity: 0.15,
        dashArray: '4, 4',
        lineJoin: 'round' // Smooths the jagged corners
    }).addTo(map);
}

// FIX: Ensure this is NOT nested inside drawUncertaintyCone
let step = 0;
function animateForecast() {
    if (step < forecastTrack.length) {
        forecastLine.addLatLng([forecastTrack[step].lat, forecastTrack[step].lon]);
        addMarker(forecastTrack[step], false);
        step++;
        setTimeout(animateForecast, 600);
    } else {
        // Only draw the cone once the path is complete
        drawUncertaintyCone(forecastTrack, forecastErrors);
    }
}

// START THE ANIMATION
animateForecast();
	 const updateRadar = () => {
        fetch('https://api.rainviewer.com/public/weather-maps.json')
            .then(res => res.json())
            .then(data => {
                const latest = data.radar.past.pop();
                const radarUrl = `${data.host}${latest.path}/1024/{z}/{x}/{y}/2/1_1.png`;
                
                if (window.radarLayer) map.removeLayer(window.radarLayer);
                
                window.radarLayer = L.tileLayer(radarUrl, { 
                    opacity: 0.5,
                    maxZoom: 11,
                    maxNativeZoom: 7,
                    zIndex: 100 
                }).addTo(map);
            })
            .catch(err => console.error("Radar failed:", err));
    };
    updateRadar(); 
	addNasaToWindyMenu(map, 'MODIS_Terra_CorrectedReflectance_TrueColor', 'NASA Satellite');
});
		// 1. Create a simple HTML element to follow the mouse
		function addNasaToWindyMenu(map, layerID, label) {
    // 1. Create the NASA Layer (hidden by default)
    const nasaLayer = L.tileLayer.wms('https://nasa.gov', {
        layers: layerID,
        format: 'image/png',
        transparent: true,
        opacity: 0.8,
        attribution: 'NASA'
    });

    // 2. Function to inject the button into the DOM
    const injectButton = () => {
        // Search for the Windy menu container
        const menu = document.querySelector('.menu-content') || document.querySelector('.layers-list');
        if (!menu) return;

        // Check if button already exists to avoid duplicates
        if (document.getElementById(`btn-${layerID}`)) return;

        const btn = document.createElement('div');
        btn.id = `btn-${layerID}`;
        btn.className = 'menu-item'; // Matches Windy's native button class
        btn.style.cssText = 'cursor: pointer; padding: 10px; margin-top: 5px; border-radius: 4px; background: #333; transition: 0.3s;';
        btn.innerHTML = `<span>${label}</span>`;

        // 3. Toggle Logic
        btn.onclick = () => {
            if (map.hasLayer(nasaLayer)) {
                map.removeLayer(nasaLayer);
                btn.style.background = '#333'; // Reset to dark
                btn.style.color = 'white';
            } else {
                map.addLayer(nasaLayer);
                btn.style.background = '#e67e22'; // Matches Windy orange
                btn.style.color = 'white';
            }
        };

        menu.appendChild(btn);
    };

    // Run injection. We use an interval because Windy's menu often 
    // re-renders when the user interacts with it.
    setInterval(injectButton, 2000);
}
    // 2. RADAR LOGIC
// 3. TOGGLE FUNCTION (Outside init, using global leafletMap)
		// URL Template for NASA GIBS
	
document.getElementById('toggleRadar').onclick = function() {
    if (!window.radarLayer || !leafletMap) {
        console.log("Radar layer or map not ready yet");
        return;
    }

    if (leafletMap.hasLayer(window.radarLayer)) {
        leafletMap.removeLayer(window.radarLayer);
        this.style.background = "rgba(0,0,0,0.7)"; 
        this.innerText = "Radar OFF";
    } else {
        leafletMap.addLayer(window.radarLayer);
        this.style.background = "#2c3e50";
        this.innerText = "Radar ON";
    }
};

// 4. OVERLAY SWITCHER
function changeOverlay(type) {
    if (windyStore) {
        windyStore.set('overlay', type);
    }
}
</script>
</body>
</html>
