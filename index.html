<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Leaflet NOAA METAR Bounding Box Example</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    #map { height: 100vh; width: 100%; margin: 0; }
    body { margin: 0; padding: 0; }
  </style>
</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // Initialize map centered over the US
  const map = L.map('map').setView([39.8283, -98.5795], 5);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '© OpenStreetMap contributors'
  }).addTo(map);

  // Layer group to keep track of METAR markers
  const stationLayerGroup = L.layerGroup().addTo(map);

  let fetchTimeout = null;

  // Function to fetch METARs inside current viewport
  async function fetchMetarsInBounds() {
    const bounds = map.getBounds();
    const south = bounds.getSouth().toFixed(4);
    const west = bounds.getWest().toFixed(4);
    const north = bounds.getNorth().toFixed(4);
    const east = bounds.getEast().toFixed(4);

    // NOAA AWC API bbox format: minLat,minLon,maxLat,maxLon
    const url = `https://aviationweather.gov/api/data/metar?bbox=${south},${west},${north},${east}&format=geojson`;

    try {
      const response = await fetch(url);
      if (!response.ok) return;

      const geojsonData = await response.json();

      // Clear previous markers
      stationLayerGroup.clearLayers();

      // Add new station markers
      L.geoJSON(geojsonData, {
        onEachFeature: (feature, layer) => {
          const props = feature.properties;
          const name = props.name || props.icaoId || 'Unknown Station';
          const temp = props.temp != null ? `${props.temp}°C` : 'N/A';
          const rawReport = props.rawOb || 'No raw report available';

          layer.bindPopup(`
            <strong>${name}</strong> (${props.icaoId})<br/>
            <b>Temp:</b> ${temp}<br/>
            <b>Observation:</b> <code>${rawReport}</code>
          `);
        }
      }).addTo(stationLayerGroup);

    } catch (error) {
      console.error('Error fetching NOAA METAR data:', error);
    }
  }

  // Debounce wrapper to prevent redundant API calls during fast movement
  function onMapMoveEnd() {
    clearTimeout(fetchTimeout);
    fetchTimeout = setTimeout(() => {
      fetchMetarsInBounds();
    }, 300); // 300ms delay
  }

  // Bind the event listener
  map.on('moveend', onMapMoveEnd);

  // Initial fetch on page load
  fetchMetarsInBounds();
</script>

</body>
</html>
