<!DOCTYPE html>
<html>
<head>
    <title>Windy API Smooth Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/leaflet@1.4.0/dist/leaflet.js"></script>
    <script src="https://api.windy.com/assets/map-forecast/libBoot.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; }
        #windy { width: 100vw; height: 100vh; }
        #controls { position: absolute; top: 10px; left: 10px; z-index: 1000; background: rgba(0,0,0,0.7); padding: 10px; border-radius: 5px; color: white; }
        #cursor-label { position: absolute; z-index: 2000; pointer-events: none; background: rgba(0,0,0,0.8); color: #fff; padding: 5px 10px; border-radius: 4px; display: none; font-size: 13px; border: 1px solid #444; }
        button { cursor: pointer; padding: 5px 10px; margin: 2px; border: none; border-radius: 3px; }
    </style>
</head>
<body>

    <div id="windy"></div>
    <div id="cursor-label"></div>

    <div id="controls">
        <button onclick="changeOverlay('wind')">Wind</button>
        <button onclick="changeOverlay('temp')">Temp</button>
        <button id="toggleRadar">Toggle Radar</button>
    </div>

    <script>
        let windyStore, radarLayer;

        const options = {
            key: 'oY3mEEE9INICIpQQi8QvQlDJA365LMC3', // Replace with your actual key
            lat: 22.3,
            lon: 114.17,
            zoom: 5
            // --- SMOOTH ZOOM SETTINGS ---
        };

        windyInit(options, windyAPI => {
    const { map, store, picker } = windyAPI;
    
    // 1. Setup Initial Map State
    store.set('overlay', 'wind');
    
    // 2. Define Intensity Styles (HKO Standard-ish)
    const intensityStyles = {
        "T.D.":    { color: '#FFEE58', radius: 8, name: 'Tropical Depression' },
        "T.S.":    { color: '#42A5F5', radius: 8, name: 'Tropical Storm' },
        "S.T.S.":  { color: '#66BB6A', radius: 8, name: 'Severe Tropical Storm' },
        "T.":      { color: '#FFA726', radius: 8, name: 'Typhoon' },
        "S.T.":    { color: '#EF5350', radius: 8, name: 'Severe Typhoon' },
        "SuperT.": { color: '#AB47BC', radius: 8, name: 'Super Typhoon' }
    };

    // 3. Track Data with Wind Speeds (km/h)
    const pastTrack = [
        { lat: 8.6, lon: 153, intensity: "T.D.", wind: 45 },
        { lat: 8.7, lon: 152.1, intensity: "T.D.", wind: 50 },
        { lat: 8, lon: 151.3, intensity: "T.D.", wind: 60 },
        { lat: 8, lon: 151, intensity: "T.D.", wind: 60 },
	{ lat: 8, lon: 150.4, intensity: "T.S.", wind: 65 }
    ];

    const forecastTrack = [
        { lat: 8, lon: 150.4, intensity: "T.S.", wind: 65 },
        { lat: 8.7, lon: 149.5, intensity: "S.T.S.", wind: 90 },
        { lat: 9.9, lon: 148.1, intensity: "T.", wind: 130 },
	{ lat: 11.2, lon: 145.8, intensity: "S.T.", wind: 180 },
	{ lat: 13.2, lon: 142.8, intensity: "SuperT.", wind: 200 },
	{ lat: 15.1, lon: 140.9, intensity: "SuperT.", wind: 200 }
    ];

    // 4. Draw Hong Kong 50km Ring
    L.circle([22.3193, 114.1694], {
        color: '#0000ff',
        fillColor: '#0000ff',
        fillOpacity: 0.05,
        radius: 800000,
        weight: 1
    }).addTo(map);

    // 5. Draw Track Lines
    L.polyline(pastTrack.map(p => [p.lat, p.lon]), { color: '#333', weight: 2 }).addTo(map);
    const forecastLine = L.polyline([], { color: 'red', weight: 2, dashArray: '5, 10' }).addTo(map);

    // 6. Function to Draw Styled Markers & Labels
    function addMarker(point, isPast) {
        const style = intensityStyles[point.intensity] || { color: '#fff', radius: 4, name: 'Unknown' };
        
        // The Marker
        const marker = L.circleMarker([point.lat, point.lon], {
            radius: style.radius,
            fillColor: style.color,
            color: isPast ? '#000' : 'red',
            weight: 1.5,
            fillOpacity: 1
        }).addTo(map);

        // The Wind Speed Label (Permanent Tooltip)
        marker.bindTooltip(`${point.wind} km/h`, {
            permanent: true, 
            direction: 'right',
            className: 'wind-label',
            offset: [10, 0]
        });

        // Detail Popup
        marker.bindPopup(`<b>${style.name}</b><br>Wind: ${point.wind} km/h<br>Status: ${isPast ? 'Past' : 'Forecast'}`);
    }

    // 7. Render Past Markers
    pastTrack.forEach(p => addMarker(p, true));

    // 8. Animate Forecast Markers
    let step = 0;
    function animateForecast() {
        if (step < forecastTrack.length) {
            const currentPoints = forecastTrack.slice(0, step + 1);
            forecastLine.setLatLngs(currentPoints.map(p => [p.lat, p.lon]));
            
            addMarker(forecastTrack[step], false);
            
            step++;
            setTimeout(animateForecast, 800);
        }
    }
    animateForecast();


    // 7. RainViewer Radar Logic
    fetch('https://api.rainviewer.com/public/weather-maps.json')
        .then(res => res.json())
        .then(data => {
            const frame = data.radar.past[data.radar.past.length - 1];
            const radarUrl = `${data.host}${frame.path}/1024/{z}/{x}/{y}/2/1_1.png`;
            radarLayer = L.tileLayer(radarUrl, {
            opacity: 0.6,
            zIndex: 1000,
            // --- CRITICAL ZOOM SETTINGS ---
            maxZoom: 18,        // Allows the user to zoom deep into the map
            maxNativeZoom: 7,   // Tells Leaflet to STOP requesting new tiles after zoom 7
                                // and stretch the zoom-7 tiles instead.
            attribution: 'RainViewer'
        }).addTo(map);
        });
});
    </script>
</body>
</html>
