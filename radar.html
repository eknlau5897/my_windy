<!DOCTYPE html>
<html>
<head>
    <title>Rain Viewer Weather</title>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link href="https://unpkg.com/leaflet/dist/leaflet.css" rel="stylesheet"/>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <style>
        body { margin: 0; font-family: sans-serif; }
        .controls {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 50px;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px;
            background: white;
            z-index: 1000;
            box-sizing: border-box;
        }
        .title { font-weight: 400; color: #333; }
        #timestamp { font-size: 18px; font-weight: 600; color: #333; }
        .buttons { display: flex; gap: 8px; }
        .buttons button {
            width: 36px; height: 36px;
            border: 1px solid #ddd; border-radius: 4px;
            background: #fff; cursor: pointer; font-size: 16px;
        }
        .buttons button:hover { background: #f5f5f5; }
        #mapid { position: absolute; top: 50px; left: 0; bottom: 0; right: 0; }

        /* === ACCURATE RADAR COLOR CONVERSION === */
        /* Uses Grayscale tile input to correctly map Intensity -> Green -> Yellow -> Red */
        .radar-tiles {
            filter: invert(1) hue-rotate(180deg) saturate(5) contrast(1.8) brightness(0.9);
        }

        /* Styling for the Ring Distance Labels */
        .ring-label {
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid #333; color: #222;
            font-weight: bold; font-size: 11px;
            padding: 1px 4px; border-radius: 3px;
        }

        /* Styling for the Radar Legend */
        .radar-legend {
            position: absolute; top: 65px; right: 15px; z-index: 1000;
            background: rgba(255, 255, 255, 0.9); padding: 10px 12px;
            border-radius: 6px; box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            font-size: 12px; color: #333;
        }
        .radar-legend-title { font-weight: bold; margin-bottom: 6px; font-size: 11px; text-transform: uppercase; color: #555; }
        .gradient-bar {
            height: 12px; width: 160px; border-radius: 3px;
            background: linear-gradient(to right, #2ecc71, #f1c40f, #e67e22, #e74c3c, #8e44ad);
            border: 1px solid #ccc;
        }
        .gradient-labels { display: flex; justify-content: space-between; margin-top: 4px; font-size: 10px; color: #666; }
    </style>
</head>
<body>

<div class="controls">
    <span class="title">Weather Radar</span>
    <span id="timestamp">Loading...</span>
    <div class="buttons">
        <button onclick="stop(); showFrame(animationPosition - 1);">‹</button>
        <button id="playBtn" onclick="playStop();">▶</button>
        <button onclick="stop(); showFrame(animationPosition + 1);">›</button>
    </div>
</div>

<div class="radar-legend">
    <div class="radar-legend-title">Precipitation Intensity</div>
    <div class="gradient-bar"></div>
    <div class="gradient-labels">
        <span>Light</span>
        <span>Moderate</span>
        <span>Heavy</span>
    </div>
</div>

<div id="mapid"></div>

<script>
// === CONFIGURATION ===
var TILE_SIZE = window.devicePixelRatio >= 2 ? 512 : 256;
var RADAR_OPACITY = 0.8;
var ANIMATION_DELAY_MS = 500;
var API_URL = "https://api.rainviewer.com/public/weather-maps.json";

// === HONG KONG & DISTANCE RINGS SETUP ===
var HK_COORDS = [22.3193, 114.1694];
var RING_DISTANCES = [100, 200, 400, 800];

// === STATE ===
var apiData = {};
var mapFrames = [];
var animationPosition = 0;
var animationTimer = false;
var currentLayer = null;
var isLoading = false;
var layerCache = {};

// === MAP SETUP ===
var map = L.map('mapid', { maxZoom: 12 }).setView(HK_COORDS, 6);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; <a href="https://openstreetmap.org">OpenStreetMap</a> contributors'
}).addTo(map);

// === ADD DISTANCE RINGS ===
L.circleMarker(HK_COORDS, { radius: 5, color: '#e74c3c', fillColor: '#e74c3c', fillOpacity: 1 }).addTo(map).bindPopup("Hong Kong");

RING_DISTANCES.forEach(function(distanceKm) {
    L.circle(HK_COORDS, {
        radius: distanceKm * 1000,
        color: '#34495e', weight: 1.5, dashArray: '6, 6', fill: false, interactive: false
    }).addTo(map);

    var labelLat = HK_COORDS[0] + (distanceKm / 111);
    L.marker([labelLat, HK_COORDS[1]], {
        icon: L.divIcon({ className: 'ring-label', html: distanceKm + ' km', iconSize: [50, 18], iconAnchor: [25, 9] }),
        interactive: false
    }).addTo(map);
});

// === LAYER MANAGEMENT ===
function createRadarLayer(frame) {
    // Note: Requesting Scheme '0' (Black & White linear scheme) so brightness scales cleanly
    return new L.TileLayer(apiData.host + frame.path + '/' + TILE_SIZE + '/{z}/{x}/{y}/0/1_1.png', {
        tileSize: 256,
        opacity: 0.001,
        maxNativeZoom: 7,
        maxZoom: 12,
        className: 'radar-tiles' // Applies clean color filter
    });
}

// === ANIMATION & UTILITIES ===
function wrapPosition(position) {
    while (position >= mapFrames.length) position -= mapFrames.length;
    while (position < 0) position += mapFrames.length;
    return position;
}

function formatTime(timestamp) {
    return new Date(timestamp * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function clearLayerCache() {
    stop();
    for (var pos in layerCache) {
        if (parseInt(pos) !== animationPosition) {
            map.removeLayer(layerCache[pos]);
            delete layerCache[pos];
        }
    }
}

function stop() {
    if (animationTimer) {
        clearTimeout(animationTimer);
        animationTimer = false;
        document.getElementById("playBtn").innerHTML = "▶";
        return true;
    }
    return false;
}

function play() {
    animationTimer = true;
    document.getElementById("playBtn").innerHTML = "⏸";
    showFrame(animationPosition + 1);
}

function playStop() {
    if (!stop()) play();
}

function updateTimestamp(frame) {
    document.getElementById("timestamp").innerHTML = formatTime(frame.time);
}

function showFrame(position) {
    if (isLoading) return;

    position = wrapPosition(position);
    var frame = mapFrames[position];

    updateTimestamp(frame);

    var oldLayer = currentLayer;

    if (layerCache[position]) {
        if (oldLayer) oldLayer.setOpacity(0);
        layerCache[position].setOpacity(RADAR_OPACITY);
        currentLayer = layerCache[position];
        animationPosition = position;
        if (animationTimer) animationTimer = setTimeout(play, ANIMATION_DELAY_MS);
        return;
    }

    isLoading = true;
    var newLayer = createRadarLayer(frame);

    newLayer.on('load', function() {
        newLayer.setOpacity(RADAR_OPACITY);
        if (oldLayer) oldLayer.setOpacity(0);
        layerCache[position] = newLayer;
        currentLayer = newLayer;
        animationPosition = position;
        isLoading = false;
        if (animationTimer) animationTimer = setTimeout(play, ANIMATION_DELAY_MS);
    });

    newLayer.addTo(map);
}

function initialize(api) {
    clearLayerCache();
    currentLayer = null;
    mapFrames = [];
    animationPosition = 0;
    if (!api || !api.radar || !api.radar.past) return;
    mapFrames = api.radar.past;
    showFrame(mapFrames.length - 1);
}

function loadApiData() {
    var apiRequest = new XMLHttpRequest();
    apiRequest.open("GET", API_URL, true);
    apiRequest.onload = function() {
        apiData = JSON.parse(apiRequest.response);
        initialize(apiData);
    };
    apiRequest.send();
}

map.on('movestart', clearLayerCache);
loadApiData();
</script>

</body>
</html>
