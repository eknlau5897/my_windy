<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Secure GeoJSON Editor with Custom Colors</title>

    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Leaflet Draw Plugin CSS & JS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>

    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #map {
            width: 100%;
            height: 100%;
        }

        /* Control Panel */
        .control-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            padding: 18px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
            width: 250px;
        }

        .control-panel h4 {
            margin: 0 0 12px 0;
            font-size: 15px;
            color: #2c3e50;
        }

        .color-picker-group {
            margin: 10px 0;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 6px;
            border: 1px solid #e9ecef;
        }

        .color-picker-group label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            font-weight: 600;
            color: #333;
            margin-bottom: 6px;
        }

        .color-picker-group input[type="color"] {
            border: none;
            width: 32px;
            height: 24px;
            cursor: pointer;
            background: transparent;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 8px 0;
            margin-top: 8px;
            color: white;
            text-align: center;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            box-sizing: border-box;
        }

        .btn-primary { background-color: #3498db; }
        .btn-primary:hover { background-color: #2980b9; }

        .btn-success { background-color: #2ecc71; }
        .btn-success:hover { background-color: #27ae60; }
        
        .btn-danger { background-color: #e74c3c; }
        .btn-danger:hover { background-color: #c0392b; }

        input[type="file"] { display: none; }

        /* Modal Overlay */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .modal-box {
            background: white;
            padding: 25px 30px;
            border-radius: 8px;
            width: 300px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            text-align: center;
        }

        .input-field {
            width: 100%;
            padding: 9px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .error-msg {
            color: #e74c3c;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }

        .status-badge {
            font-size: 11px;
            padding: 3px 6px;
            border-radius: 3px;
            font-weight: normal;
        }
        .status-locked { background: #ffebee; color: #c62828; }
        .status-unlocked { background: #e8f5e9; color: #2e7d32; }
    </style>
</head>
<body>

    <!-- UI Panel -->
    <div class="control-panel">
        <h4>GeoJSON Editor 
            <span id="auth-status" class="status-badge status-locked">Locked</span>
        </h4>

        <!-- Login Button -->
        <button id="login-trigger-btn" class="btn btn-success" onclick="openLoginModal()">🔒 Log In to Draw / Upload</button>

        <!-- Authorized Controls -->
        <div id="authenticated-controls" style="display: none;">
            
            <!-- Color Selector Controls -->
            <div class="color-picker-group">
                <label>
                    Border Color:
                    <input type="color" id="border-color" value="#3498db" onchange="updateDrawOptions()">
                </label>
                <label>
                    Fill Color:
                    <input type="color" id="fill-color" value="#2ecc71" onchange="updateDrawOptions()">
                </label>
                <label>
                    Fill Opacity:
                    <input type="range" id="fill-opacity" min="0.1" max="1" step="0.1" value="0.4" onchange="updateDrawOptions()">
                </label>
            </div>

            <label for="geojson-input" class="btn btn-primary">📂 Upload GeoJSON</label>
            <input type="file" id="geojson-input" accept=".geojson, .json" />
            
            <button class="btn btn-success" onclick="exportGeoJSON()">💾 Export Drawing</button>
            <button class="btn btn-danger" onclick="clearMap()">Clear All Shapes</button>
            <button class="btn btn-danger" style="background-color: #7f8c8d; margin-top: 15px;" onclick="logout()">Log Out</button>
        </div>
    </div>

    <!-- Login Modal -->
    <div id="login-modal" class="modal-overlay">
        <div class="modal-box">
            <h3>Authorization</h3>
            <p style="font-size: 12px; color: #666;">Enter password to unlock editor tools.</p>
            
            <!-- Masked Password Field (Displays dots/asterisks when typing) -->
            <input type="password" id="password-input" class="input-field" placeholder="Enter Password" />
            
            <div id="error-message" class="error-msg">Incorrect password.</div>
            
            <button class="btn btn-success" style="margin-top: 12px;" onclick="attemptLogin()">Unlock Editor</button>
            <button class="btn btn-danger" style="background-color: #95a5a6;" onclick="closeLoginModal()">Cancel</button>
        </div>
    </div>

    <!-- Map Container -->
    <div id="map"></div>

<script>
    // 1. Initialize Map
    var map = L.map('map').setView([22.3193, 114.1694], 10);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    var drawnItems = new L.FeatureGroup().addTo(map);
    var drawControl = null;

    // 2. Dynamic Drawing Styling
    function getActiveStyle() {
        return {
            color: document.getElementById('border-color').value,
            fillColor: document.getElementById('fill-color').value,
            fillOpacity: parseFloat(document.getElementById('fill-opacity').value),
            weight: 3
        };
    }

    function updateDrawOptions() {
        if (!drawControl) return;

        var currentStyle = getActiveStyle();
        map.removeControl(drawControl);
        
        drawControl = new L.Control.Draw({
            edit: { featureGroup: drawnItems },
            draw: {
                polygon: { shapeOptions: currentStyle },
                rectangle: { shapeOptions: currentStyle },
                polyline: { shapeOptions: { color: currentStyle.color } },
                circle: { shapeOptions: currentStyle },
                marker: true,
                circlemarker: false
            }
        });
        
        map.addControl(drawControl);
    }

    map.on(L.Draw.Event.CREATED, function (e) {
        var layer = e.layer;
        drawnItems.addLayer(layer);
    });

    // 3. OBFUSCATED BASE64 AUTHENTICATION
    // Password "map123" is reversed to "321pam", then Base64 encoded as "MzIxcGFt"
    const OBFUSCATED_SECRET = "MzIxcGFt";

    function decodeSecret(obfuscated) {
        var decoded = atob(obfuscated);
        return decoded.split('').reverse().join('');
    }

    function checkAuthState() {
        var isAuthenticated = sessionStorage.getItem("geojson_auth") === "true";
        
        var authStatus = document.getElementById("auth-status");
        var loginBtn = document.getElementById("login-trigger-btn");
        var authControls = document.getElementById("authenticated-controls");

        if (isAuthenticated) {
            authStatus.textContent = "Unlocked";
            authStatus.className = "status-badge status-unlocked";
            loginBtn.style.display = "none";
            authControls.style.display = "block";
            
            updateDrawOptions();
        } else {
            authStatus.textContent = "Locked";
            authStatus.className = "status-badge status-locked";
            loginBtn.style.display = "block";
            authControls.style.display = "none";
            
            if (drawControl) map.removeControl(drawControl);
        }
    }

    function openLoginModal() {
        document.getElementById("login-modal").style.display = "flex";
        document.getElementById("password-input").focus();
    }

    function closeLoginModal() {
        document.getElementById("login-modal").style.display = "none";
        document.getElementById("error-message").style.display = "none";
        document.getElementById("password-input").value = "";
    }

    function attemptLogin() {
        var inputPass = document.getElementById("password-input").value;
        var realPassword = decodeSecret(OBFUSCATED_SECRET);

        if (inputPass === realPassword) {
            sessionStorage.setItem("geojson_auth", "true");
            closeLoginModal();
            checkAuthState();
        } else {
            document.getElementById("error-message").style.display = "block";
        }
    }

    // Allow pressing "Enter" key in password box to submit login
    document.getElementById("password-input").addEventListener("keyup", function(event) {
        if (event.key === "Enter") {
            attemptLogin();
        }
    });

    function logout() {
        sessionStorage.removeItem("geojson_auth");
        clearMap();
        checkAuthState();
    }

    // 4. File Upload
    document.getElementById('geojson-input').addEventListener('change', function (event) {
        if (sessionStorage.getItem("geojson_auth") !== "true") return;

        var file = event.target.files[0];
        if (!file) return;

        var reader = new FileReader();
        reader.onload = function (e) {
            try {
                var data = JSON.parse(e.target.result);
                var geoLayer = L.geoJSON(data, {
                    style: getActiveStyle()
                });
                
                geoLayer.eachLayer(function(layer) {
                    drawnItems.addLayer(layer);
                });

                map.fitBounds(drawnItems.getBounds());
            } catch (err) {
                alert("Invalid GeoJSON file format.");
            }
        };
        reader.readAsText(file);
    });

    // 5. Export GeoJSON
    function exportGeoJSON() {
        var data = drawnItems.toGeoJSON();
        if (data.features.length === 0) {
            alert("No shapes to export. Draw something on the map first!");
            return;
        }

        var jsonString = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(data, null, 2));
        var downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", jsonString);
        downloadAnchor.setAttribute("download", "custom_map_area.geojson");
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
    }

    function clearMap() {
        drawnItems.clearLayers();
        document.getElementById('geojson-input').value = "";
    }

    checkAuthState();
</script>

</body>
</html>
